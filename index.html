<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="Bobcat Brawl: a retro arcade fighting game starring the Mary Bragg crew.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bobcat Brawl">
<meta property="og:title" content="Bobcat Brawl">
<meta property="og:description" content="Retro arcade fighting game. Pick your fighter and take on the Mary Bragg crew!">
<meta property="og:image" content="https://lchoeng.github.io/bobcat-brawl/icon-512.png">
<title>Bobcat Brawl</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{display:block;width:100vw;max-width:calc((100dvh - 190px) * 1.714);aspect-ratio:384/224;background:#000;
  image-rendering:pixelated;image-rendering:crisp-edges}
#pad{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;padding:16px 14px 8px;box-sizing:border-box}
#dpad{width:156px;height:132px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:42% 58%;gap:6px;touch-action:none}
.z{display:flex;align-items:center;justify-content:center;border-radius:10px;background:#1a1a22;color:#ddd;
  font-weight:900;font-size:22px;border:2px solid #555;pointer-events:none;box-shadow:inset 0 -4px 0 #000}
.z.up{grid-column:1/3;font-size:14px;letter-spacing:1px}
.z.on{background:#f2a71b;color:#1b2468;border-color:#f2a71b}
#mid{display:flex;flex-direction:column;align-items:center;gap:6px}
#mute{width:40px;height:40px;border-radius:50%;border:2px solid #555;background:#1a1a22;color:#f2a71b;font-size:18px;padding:0}
#btns{display:flex;gap:12px;align-items:flex-end}
#btns button{width:82px;height:82px;border-radius:50%;border:3px solid #111;color:#fff;font-weight:900;font-size:15px;
  letter-spacing:.5px;touch-action:none;font-family:inherit;padding:0;box-shadow:inset 0 -6px 0 rgba(0,0,0,.35),0 3px 0 #000;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#bp{background:#d42a22;margin-bottom:26px}
#bk{background:#2456d6}
#btns button.on{filter:brightness(1.4);transform:translateY(2px)}
#hint{display:none;color:#9aa3c8;font-size:13px;padding:10px;text-align:center}
@media (orientation:landscape) and (max-height:520px){
  canvas{width:auto;height:100dvh;max-width:100vw}
  #pad{position:fixed;left:0;right:0;bottom:6px;max-width:none;padding:0 10px;opacity:.7}
  #dpad{width:128px;height:108px}
  #btns button{width:66px;height:66px;font-size:13px}
  #mute{width:32px;height:32px;font-size:14px}
}
@media (hover:hover) and (pointer:fine){
  #pad{display:none} #hint{display:block}
  canvas{max-width:calc((100dvh - 60px) * 1.714)}
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="384" height="224"></canvas>
  <div id="pad">
    <div id="dpad">
      <div class="z up" id="zu">&#9650; JUMP</div>
      <div class="z" id="zl">&#9664;</div>
      <div class="z" id="zr">&#9654;</div>
    </div>
    <div id="mid"><button id="mute" aria-label="Music on or off">&#9835;</button></div>
    <div id="btns">
      <button id="bk">KICK</button>
      <button id="bp">PUNCH</button>
    </div>
  </div>
  <div id="hint">&larr; &rarr; move &middot; &uarr; jump &middot; Z punch &middot; X kick &middot; Enter select &middot; hold away from your opponent to block &middot; M music</div>
</div>
<script>
'use strict';
const W=384,H=224,SW=560,MAXC=SW-W,GY=204;
const cv=document.getElementById('c');
const mainG=cv.getContext('2d');
let g=mainG;
g.imageSmoothingEnabled=false;
const OUT='#1a0e14',NAVY='#1b2468',GOLD='#f2a71b',SKIN='#efb487',HAIR='#2b1d18',FUR='#f39a1e',FURD='#b8620c',CREAM='#ffe2a8';
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);}
function rng(s){return function(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};}

/* ================= colour helpers ================= */
const HX={},SHC={};
function hexA(c){if(HX[c])return HX[c];return HX[c]=[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function toHex(a){return '#'+a.map(function(v){return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');}).join('');}
function shade(c,k){if(k===1)return c;const key=c+k;if(SHC[key])return SHC[key];const a=hexA(c);
  return SHC[key]=toHex(k<1?a.map(function(v){return v*k;}):a.map(function(v){return v+(255-v)*(k-1);}));}

/* ================= pixel font ================= */
const FD={A:'01110 10001 10001 11111 10001 10001 10001',B:'11110 10001 10001 11110 10001 10001 11110',C:'01110 10001 10000 10000 10000 10001 01110',
D:'11110 10001 10001 10001 10001 10001 11110',E:'11111 10000 10000 11110 10000 10000 11111',F:'11111 10000 10000 11110 10000 10000 10000',
G:'01110 10001 10000 10111 10001 10001 01111',H:'10001 10001 10001 11111 10001 10001 10001',I:'01110 00100 00100 00100 00100 00100 01110',
J:'00111 00010 00010 00010 00010 10010 01100',K:'10001 10010 10100 11000 10100 10010 10001',L:'10000 10000 10000 10000 10000 10000 11111',
M:'10001 11011 10101 10101 10001 10001 10001',N:'10001 10001 11001 10101 10011 10001 10001',O:'01110 10001 10001 10001 10001 10001 01110',
P:'11110 10001 10001 11110 10000 10000 10000',Q:'01110 10001 10001 10001 10101 10010 01101',R:'11110 10001 10001 11110 10100 10010 10001',
S:'01111 10000 10000 01110 00001 00001 11110',T:'11111 00100 00100 00100 00100 00100 00100',U:'10001 10001 10001 10001 10001 10001 01110',
V:'10001 10001 10001 10001 10001 01010 00100',W:'10001 10001 10001 10101 10101 10101 01010',X:'10001 10001 01010 00100 01010 10001 10001',
Y:'10001 10001 01010 00100 00100 00100 00100',Z:'11111 00001 00010 00100 01000 10000 11111',
'0':'01110 10001 10011 10101 11001 10001 01110','1':'00100 01100 00100 00100 00100 00100 01110','2':'01110 10001 00001 00010 00100 01000 11111',
'3':'11111 00010 00100 00010 00001 10001 01110','4':'00010 00110 01010 10010 11111 00010 00010','5':'11111 10000 11110 00001 00001 10001 01110',
'6':'00110 01000 10000 11110 10001 10001 01110','7':'11111 00001 00010 00100 01000 01000 01000','8':'01110 10001 10001 01110 10001 10001 01110',
'9':'01110 10001 10001 01111 00001 00010 01100','!':'00100 00100 00100 00100 00100 00000 00100','.':'00000 00000 00000 00000 00000 01100 01100',
',':'00000 00000 00000 00000 01100 00100 01000','?':'01110 10001 00001 00010 00100 00000 00100','-':'00000 00000 00000 11111 00000 00000 00000',
"'":'00100 00100 01000 00000 00000 00000 00000',':':'00000 01100 01100 00000 01100 01100 00000','/':'00001 00010 00010 00100 01000 01000 10000',
'"':'01010 01010 00000 00000 00000 00000 00000','<':'00010 00110 01110 11110 01110 00110 00010','>':'01000 01100 01110 01111 01110 01100 01000',' ':'00000 00000 00000 00000 00000 00000 00000'};
const FONT={};for(const k in FD)FONT[k]=FD[k].split(' ');
const TS={
  w:{f:['#ffffff'],o:OUT,ow:1},
  y:{f:['#fff6a8','#ffe86a','#ffd93a','#ffc928','#ffb51e','#ff9f18','#f58a12'],o:OUT,ow:1},
  gr:{f:['#9aa3c8'],o:OUT,ow:1},
  g:{grad:['#fffbe0','#fff07a','#ffd21f','#ffa214','#f26a12','#d8341a'],o:'#0d0a26',ow:2,sh:'#000000'},
  r:{grad:['#ffffff','#ffd4c4','#ff8460','#ee3020','#b81018'],o:'#0d0a26',ow:2,sh:'#000000'},
  b:{grad:['#ffffff','#cdeaff','#7cc0ff','#3a7ce8','#2240b0'],o:'#0d0a26',ow:2,sh:'#000000'},
  led:{f:['#ff3a2a'],ow:0},
  ko:{f:['#d01a1a'],ow:0},
  nv:{f:[NAVY],ow:0}
};
const TC={};
function textImg(s,sc,st,bold){
  s=String(s).toUpperCase();
  const key=s+'|'+sc+'|'+st+'|'+(bold?1:0);if(TC[key])return TC[key];
  const S=TS[st],ow=S.ow||0,sh=S.sh?Math.max(1,Math.round(sc*.6)):0,cell=bold?7:6;
  const tw=Math.max(1,s.length*cell*sc-sc),th=7*sc,w=tw+ow*2+sh,h=th+ow*2+sh;
  const m=new Uint8Array(w*h),o=new Uint8Array(w*h);
  for(let i=0;i<s.length;i++){const gl=FONT[s[i]]||FONT['?'];
    for(let r=0;r<7;r++)for(let c=0;c<5;c++)if(gl[r][c]==='1')
      for(let b=0;b<(bold?2:1);b++)for(let yy=0;yy<sc;yy++)for(let xx=0;xx<sc;xx++)
        m[(ow+r*sc+yy)*w+ow+(i*cell+c+b)*sc+xx]=1;}
  if(ow){for(let Y=0;Y<h;Y++)for(let X=0;X<w;X++)if(m[Y*w+X])for(let dy=-ow;dy<=ow;dy++)for(let dx=-ow;dx<=ow;dx++){const XX=X+dx,YY=Y+dy;if(XX>=0&&YY>=0&&XX<w&&YY<h)o[YY*w+XX]=1;}}
  else o.set(m);
  const cc=document.createElement('canvas');cc.width=w;cc.height=h;
  const x=cc.getContext('2d'),id=x.createImageData(w,h),d=id.data;
  function put(i,col){const c=hexA(col);d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2];d[i*4+3]=255;}
  if(sh)for(let Y=0;Y+sh<h;Y++)for(let X=0;X+sh<w;X++)if(o[Y*w+X])put((Y+sh)*w+X+sh,S.sh);
  if(ow)for(let i=0;i<w*h;i++)if(o[i])put(i,S.o);
  for(let Y=0;Y<h;Y++){const ry=Y-ow;let col;
    if(S.grad){const t=Math.max(0,Math.min(.999,ry/th));col=S.grad[Math.floor(t*S.grad.length)];}
    else col=S.f[Math.max(0,Math.min(S.f.length-1,Math.floor(ry/sc)))];
    for(let X=0;X<w;X++)if(m[Y*w+X])put(Y*w+X,col);}
  x.putImageData(id,0,0);
  return TC[key]=cc;
}
function txt(s,x,y,sc,st,al,bold){const im=textImg(s,sc||1,st||'w',bold);let X=x;if(al==='c')X=x-(im.width>>1);else if(al==='r')X=x-im.width;g.drawImage(im,Math.round(X),Math.round(y));return im.width;}

/* ================= sprite drawing kit ================= */
let sx=null,PAL=null;
function use(c){PAL.add(c);return c;}
function V(a,b){return [a[0]+b[0],a[1]+b[1]];}
function M(a,k){return [a[0]*k,a[1]*k];}
function L(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}
function poly(pts){const p=new Path2D();p.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)p.lineTo(pts[i][0],pts[i][1]);p.closePath();return p;}
function ellP(cx,cy,rx,ry){const p=new Path2D();p.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);return p;}
function outside(cx,cy,rx,ry){const p=new Path2D();p.rect(-400,-400,800,800);p.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);return p;}
function px(x,y,w,h,c){sx.fillStyle=use(c);sx.fillRect(x,y,w,h);}
function nrm(a,b){let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;let n=[-dy,dx];if(n[1]-n[0]<0)n=[dy,-dx];return {d:[dx,dy],n:n};}
function capPath(a,b,r){const p=new Path2D(),dx=b[0]-a[0],dy=b[1]-a[1];
  if(Math.hypot(dx,dy)<.01){p.arc(a[0],a[1],r,0,Math.PI*2);return p;}
  const an=Math.atan2(dy,dx);p.arc(a[0],a[1],r,an+Math.PI/2,an+Math.PI*1.5);p.arc(b[0],b[1],r,an-Math.PI/2,an+Math.PI/2);p.closePath();return p;}
function part(path,fn,sh,hl){
  sx.save();sx.clip(path);fn(1);
  if(sh){sx.save();sx.clip(sh);fn(.7);sx.restore();}
  if(hl){sx.save();sx.clip(hl);fn(1.28);sx.restore();}
  sx.restore();sx.lineJoin='round';sx.lineWidth=1.6;sx.strokeStyle=use(OUT);sx.stroke(path);
}
function cap(a,b,r,col,pat){
  const P=capPath(a,b,r),o=nrm(a,b),e=M(o.d,r+2),A0=V(a,M(e,-1)),B0=V(b,e),n=o.n;
  const sh=poly([V(A0,M(n,r*.22)),V(B0,M(n,r*.22)),V(B0,M(n,r*3)),V(A0,M(n,r*3))]);
  const hl=poly([V(A0,M(n,-r*.38)),V(B0,M(n,-r*.38)),V(B0,M(n,-r*.78)),V(A0,M(n,-r*.78))]);
  part(P,function(k){sx.fillStyle=use(shade(col,k));sx.fillRect(-400,-400,800,800);if(pat)pat(k,a,b,r);},sh,hl);
}
function solid(path,col,lw){sx.lineJoin='round';sx.lineWidth=lw||2.4;sx.strokeStyle=use(OUT);sx.stroke(path);sx.fillStyle=use(col);sx.fill(path);}
function ball(c,r,col){const P=ellP(c[0],c[1],r,r);
  part(P,function(k){sx.fillStyle=use(shade(col,k));sx.fillRect(-400,-400,800,800);},outside(c[0]+r*.35,c[1]-r*.4,r*1.02,r*1.02),ellP(c[0]+r*.3,c[1]-r*.45,r*.38,r*.28));}
function stripeAcross(col,step,lw){return function(k,a,b,r){const o=nrm(a,b),len=Math.hypot(b[0]-a[0],b[1]-a[1]);
  sx.strokeStyle=use(shade(col,k));sx.lineWidth=lw;sx.beginPath();
  for(let t=-r+1;t<len+r;t+=step){const m=V(a,M(o.d,t));sx.moveTo(m[0]+o.n[0]*(r+2),m[1]+o.n[1]*(r+2));sx.lineTo(m[0]-o.n[0]*(r+2),m[1]-o.n[1]*(r+2));}
  sx.stroke();};}
function plaidPat(col){return function(k,a,b,r){const o=nrm(a,b),len=Math.hypot(b[0]-a[0],b[1]-a[1]);
  sx.strokeStyle=use(shade(col,k));sx.lineWidth=1.2;sx.beginPath();
  for(let t=-r+2;t<len+r;t+=5){const m=V(a,M(o.d,t));sx.moveTo(m[0]+o.n[0]*(r+2),m[1]+o.n[1]*(r+2));sx.lineTo(m[0]-o.n[0]*(r+2),m[1]-o.n[1]*(r+2));}
  const s1=V(a,M(o.n,1.2)),s2=V(b,M(o.n,1.2));sx.moveTo(s1[0]-o.d[0]*9,s1[1]-o.d[1]*9);sx.lineTo(s2[0]+o.d[0]*9,s2[1]+o.d[1]*9);
  sx.stroke();};}

/* ================= fighters ================= */
const CH=[
 {name:'JAIDEN',tag:'THE BLUE BOLT',spd:1.15,pow:.95,hp:100,hair:'spiky',shirt:'stripes',c1:'#24479e',c2:'#b4cdf4',sleeve:'long',pants:'#6d7584',shoe:'#2a2d36',sole:'#c9ced8',band:'#e02b2b',glove:'#e02b2b',
  quote:'TOO SLOW! THE BLUE BOLT ALWAYS STRIKES FIRST!'},
 {name:'AVA',tag:'CAP CRUSHER',spd:1.1,pow:1,hp:100,hair:'long',hairLen:13,cap:'#2456d6',shirt:'plaid',c1:'#d42a22',c2:'#3a9a5a',sleeve:'long',pants:'#f1efe8',shorts:true,shoe:'#ffffff',sole:'#b9bdc6',glove:'#2456d6',
  quote:"HOLD ON TO YOUR HAT. OH WAIT, I'M THE ONE WEARING IT!"},
 {name:'LINUS',tag:'GOLDEN FIST',spd:1,pow:1.1,hp:100,hair:'neat',shirt:'plain',c1:'#d39a32',sleeve:'long',pants:'#857548',shoe:'#4a3b2c',sole:'#a08a6a',band:'#1c2a8b',glove:'#f7d51d',

const HAIRS={
 spiky:[[-8,4],[-9.5,-1],[-13,-4],[-9,-6.5],[-11,-11],[-5.5,-9.5],[-4.5,-14],[-.5,-10.5],[3,-14],[5,-9.8],[9.5,-10.5],[8,-6.5],[10,-4],[6.5,-4.6],[4.5,-3.6],[2,-5],[-.5,-3.5],[-3,-3],[-4.5,1],[-6,4.5]],
 neat:[[-8,4],[-8.6,-3],[-6.5,-8.5],[-2,-10.6],[3.5,-10.4],[7.6,-7],[8.6,-2.6],[6.4,-4.4],[3.5,-5.2],[0,-4.4],[-3,-3.2],[-4.4,1],[-6,4.4]],

 long:[[-8,6],[-8.6,-3.6],[-5.6,-9.4],[0,-10.6],[5.4,-9.6],[8.4,-5.6],[8.4,-.6],[6.4,-3.8],[3.4,-5],[0,-4],[-3,-3],[-5,1.6],[-6.2,7]]
};

function face(mood,sk){
  const E='#1a1210';
  if(mood==='hurt'||mood==='beat'){px(0,-1,4,1,E);px(5,-1,2,1,E);px(-1,-4,3,1,E);px(2,-5,2,1,E);px(5,-4,2,1,E);}
  else{px(0,-2,4,3,'#ffffff');px(5,-2,2,3,'#ffffff');px(2,-2,2,3,E);px(6,-2,1,3,E);px(3,-2,1,1,'#ffffff');
    if(mood==='win'){px(-1,-4,4,1,E);px(5,-4,2,1,E);}
    else{px(-1,-4,3,1,E);px(2,-3,2,1,E);px(5,-3,2,1,E);px(6,-4,1,1,E);}}
  const np=new Path2D();np.moveTo(6.2,-.2);np.lineTo(8.8,2.4);np.lineTo(6.4,3.2);np.closePath();sx.fillStyle=use(sk);sx.fill(np);
  const nl=new Path2D();nl.moveTo(6.4,-.2);nl.lineTo(8.8,2.4);nl.lineTo(6.6,3.2);sx.lineWidth=1.1;sx.strokeStyle=use(OUT);sx.stroke(nl);
  switch(mood){
    case 'shout':px(3,3,4,3,'#3a0808');px(3,3,4,1,'#ffffff');break;
    case 'hurt':case 'beat':px(3,3,3,3,'#3a0808');break;
    case 'win':px(2,3,5,2,'#ffffff');px(2,5,5,1,'#8a2e24');px(2,3,1,2,'#8a2e24');break;
    default:px(3,4,3,1,'#8a2e24');
  }
}
function band(c,tw,y0,rx){
  const w=Math.sin(tw*1.7)*1.6,ky=y0+1.4,bx=-rx-1.4;

function tryHit(f,o,a){
  if(o.st==='ko'||o.st==='win')return;
  const sc=f.c.scale||1,osc=o.c.scale||1,dx=(o.x-f.x)*f.face;
  if(dx<-4||dx>a.reach*sc+12*osc)return;
  const ay=f.y+a.hy*sc;
  if(ay<o.y-96*osc||ay>o.y+2)return;
  f.hitDone=true;
  const sxp=f.x+f.face*Math.max(8,Math.min(dx-8*osc,a.reach*sc)),syp=GY+ay;
  const blocking=o.back&&o.y>=0&&(o.st==='walk'||o.st==='idle'||o.st==='block');
  if(blocking){o.st='block';o.t=12;o.vx=f.face*2.2;sparks.push({x:sxp,y:syp,t:0,blk:true});SFX.block();hitstop=3;return;}
  const big=a.dmg>=9;
  o.hp-=a.dmg*f.c.pow;o.vx=f.face*a.push;o.st='hit';o.t=a.stun;o.back=false;
  if(!f.cpu)score+=a.pts;
  hitstop=big?7:5;shake=big?5:3;
  sparks.push({x:sxp,y:syp,t:0,big:big});
  if(o.hp<=0){o.hp=0;o.st='ko';o.t=0;o.vy=-6;o.vx=f.face*3;o.bounced=false;hitstop=16;shake=10;SFX.ko();}
  else if(big)SFX.big();else SFX.hit();
}
function stepF(f,o,i){

  else if(f.st==='punch'||f.st==='kick'){
    const a=ATK[f.st];f.t++;
    if(f.air){if(f.t>a.st&&f.t<=a.st+14&&!f.hitDone)tryHit(f,o,ATK['j'+f.st]);}
    else{f.vx=0;if(f.t>a.st&&f.t<=a.st+a.ac&&!f.hitDone)tryHit(f,o,a);if(f.t>=a.st+a.ac+a.rc)f.st='idle';}
  }else{
    if(gr){
      f.face=o.x>=f.x?1:-1;
      const mv=(i.r?1:0)-(i.l?1:0),fwd=mv===f.face;
      f.vx=mv*(fwd?2.1:1.7)*c.spd;f.st=mv?'walk':'idle';f.back=mv!==0&&!fwd;
      if(i.u){f.vy=-8.6;f.vx=mv*2.7*c.spd;f.st='jump';f.back=false;if(!f.cpu)SFX.jump();}
    }else f.back=false;
    if(i.p||i.k){f.st=i.p?'punch':'kick';f.t=0;f.hitDone=false;f.air=!(f.y>=0&&f.vy>=0);f.back=false;SFX.swing();}
  }
  if(f.y<0||f.vy<0){
    f.y+=f.vy;f.vy+=.45;
    if(f.y>=0){f.y=0;f.vy=0;
      if(f.st==='jump')f.st='idle';
      if((f.st==='punch'||f.st==='kick')&&f.air){f.st='idle';f.air=false;}
      if(f.st==='ko'){f.vx*=.4;if(!f.bounced){f.bounced=true;f.vy=-2.6;f.y=-.1;shake=5;SFX.thud();}}
    }
  }
  f.x+=f.vx;
  if(f.y>=0&&(f.st==='hit'||f.st==='block'||f.st==='ko'||f.st==='win'))f.vx*=.8;
  f.dhp+=(f.hp-f.dhp)*.06;
}
function separate(){
  if(p1.st==='ko'||p2.st==='ko')return;

  const min=13*((p1.c.scale||1)+(p2.c.scale||1)),dx=p2.x-p1.x,d=Math.abs(dx);
  if(d<min){const push=(min-d)/2,s=dx>=0?1:-1;p1.x-=push*s;p2.x+=push*s;}
}

}
function ai(f,o){
  const i={l:0,r:0,u:0,p:0,k:0};
  const lvl=Math.min(1.25,.5+.09*li+.12*(round-1));
  const dx=o.x-f.x,d=Math.abs(dx),tw=dx>0?'r':'l',aw=dx>0?'l':'r',sc=f.c.scale||1;
  if(f.st==='jump'){if(d<64&&f.vy>0&&Math.random()<.15)i.k=1;return i;}
  if(f.st!=='idle'&&f.st!=='walk')return i;
  f.aiT--;
  const oAtk=(o.st==='punch'||o.st==='kick')&&o.t<8;
  if(oAtk&&d<70&&f.plan!=='block'&&Math.random()<.22*lvl){f.plan='block';f.aiT=20;}
  if(f.aiT<=0){
    const r=Math.random();f.fire=true;
    if(d>120){f.plan=r<.7?'approach':r<.85?'jump':'wait';f.aiT=16+Math.random()*24;}
    else if(d>55){f.plan=r<.4?'approach':r<.68?'kick':r<.8?'jump':r<.9?'wait':'retreat';f.aiT=22+Math.random()*20;}
    else{f.plan=r<.34?'punch':r<.62?'kick':r<.76?'retreat':r<.86?'block':'wait';f.aiT=24+Math.random()*26;}
    f.aiT/=(.6+.5*lvl);
  }
  switch(f.plan){
    case 'approach':i[tw]=1;if(d<40)f.aiT=0;break;
    case 'retreat':case 'block':i[aw]=1;break;
    case 'jump':if(f.fire)i.u=1;i[tw]=1;break;
    case 'punch':if(d>ATK.punch.reach*sc+8)i[tw]=1;else{i.p=1;f.plan='wait';f.aiT=Math.max(f.aiT,14/lvl);}break;
    case 'kick':if(d>ATK.kick.reach*sc+8)i[tw]=1;else{i.k=1;f.plan='wait';f.aiT=Math.max(f.aiT,16/lvl);}break;
  }
  f.fire=false;return i;
}

function update(){
  tick++;
  switch(scene){
    case 'select':
      if(selPhase==='roul'){selT++;
        const iv=selT<30?4:selT<50?7:11;
        if(selT<70&&selT%iv===0){let n;do{n=(Math.random()*7)|0;}while(n===pick1||n===cpuCur);cpuCur=n;SFX.move();}
        if(selT===70){cpuCur=ladder[0];SFX.ok();}
        if(selT>=125)startMatch();}
      return;
    case 'vs':warm();if(tick>150){go('fight');startRound();mStart();}return;
    case 'continue':if(tick%60===0){contN--;if(contN>=0)SFX.move();}if(contN<0){saveHi();go('gameover');}return;
    case 'gameover':if(tick>240)go('title');return;
    case 'ending':if(tick%3===0)confetti.push({x:Math.random()*W,y:-4,v:.6+Math.random()*1.2,c:[GOLD,'#ffffff','#d42a22','#2456d6','#ff7fb0'][(Math.random()*5)|0]});
      confetti.forEach(function(c){c.y+=c.v;c.x+=Math.sin((c.y+c.v*50)*.08)*.5;});confetti=confetti.filter(function(c){return c.y<H;});return;
    case 'fight':break;
    default:return;
  }
  phaseT++;
  if(shake>0)shake-=.5;
  for(let i=sparks.length-1;i>=0;i--){if(++sparks[i].t>12)sparks.splice(i,1);}
  if(hitstop>0){hitstop--;return;}
  if(phase==='intro'){
    stepF(p1,p2,NOIN);stepF(p2,p1,NOIN);
    if(phaseT===70)SFX.bell();
    if(phaseT>=110){phase='fight';pBuf=kBuf=0;}
  }else if(phase==='fight'){
    timer--;if(pBuf>0)pBuf--;if(kBuf>0)kBuf--;
    stepF(p1,p2,readPlayer());
    if((p1.st==='punch'||p1.st==='kick')&&p1.t===0){pBuf=0;kBuf=0;}
    stepF(p2,p1,ai(p2,p1));
    separate();
    if(p2.hp<=0)endRound(p1,false);else if(p1.hp<=0)endRound(p2,false);
    else if(timer<=0){const a=p1.hp/p1.c.hp,b=p2.hp/p2.c.hp;endRound(a>b?p1:b>a?p2:null,true);}
  }else if(phase==='ko'){
    if(!(phaseT<60&&phaseT%3)){stepF(p1,p2,NOIN);stepF(p2,p1,NOIN);}
    if(phaseT===90&&rw){rw.st='win';rw.t=0;rw.vx=0;}
    if(phaseT>=250){
      if(rw&&rw.wins>=2){mw=rw;saveHi();go('quote');}
      else{if(rw)round++;startRound();}
    }
  }
  camUpd();
}

    case 'quote':if((k==='ok'||k==='alt')&&tick>30)endQuote();break;
    case 'continue':if(k==='ok'||k==='alt')doContinue();break;
    case 'gameover':case 'ending':if((k==='ok'||k==='alt')&&tick>60)go('title');break;
  }
}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();au();
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W,y=(e.clientY-r.top)/r.height*H;
  if(scene==='select'){
    if(selPhase!=='pick')return;
    for(let i=0;i<7;i++){const p=gridPos(i);if(x>=p[0]-2&&x<=p[0]+34&&y>=p[1]-2&&y<=p[1]+34){if(i===sel)confirmSel();else{sel=i;SFX.move();}return;}}
    if(x>=8&&x<=112&&y>=36&&y<=160)confirmSel();
    return;
  }
  if(scene!=='fight')menu('ok');
});
const KM={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',' ':'u'};
window.addEventListener('keydown',function(e){
  const k=KM[e.key];
  if(k||e.key==='Enter'||e.key==='ArrowDown')e.preventDefault();
  if(e.repeat)return;
  if(k){held[k]=1;menu(k);return;}
  if(e.key==='z'||e.key==='Z'||e.key==='j'||e.key==='J'){pBuf=8;menu('ok');}
  else if(e.key==='x'||e.key==='X'||e.key==='k'||e.key==='K'){kBuf=8;menu('alt');}
  else if(e.key==='Enter')menu('ok');
  else if(e.key==='m'||e.key==='M'){au();setMusic(!musicOn);}
});
window.addEventListener('keyup',function(e){const k=KM[e.key];if(k)held[k]=0;});
window.addEventListener('blur',function(){held.l=held.r=held.u=0;touch.l=touch.r=touch.u=0;});
document.addEventListener('contextmenu',function(e){e.preventDefault();});
const dp=document.getElementById('dpad'),zu=document.getElementById('zu'),zl=document.getElementById('zl'),zr=document.getElementById('zr');
let dpId=null;
function dset(l,r,u){
  if(l&&!touch.l)menu('l');if(r&&!touch.r)menu('r');if(u&&!touch.u)menu('u');
  touch.l=l;touch.r=r;touch.u=u;
  zl.classList.toggle('on',!!l);zr.classList.toggle('on',!!r);zu.classList.toggle('on',!!u);
}
function dz(e){const b=dp.getBoundingClientRect(),x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height;let l=0,r=0,u=0;
  if(y<.42){u=1;if(x<.3)l=1;else if(x>.7)r=1;}else{if(x<.5)l=1;else r=1;}dset(l,r,u);}
dp.addEventListener('pointerdown',function(e){e.preventDefault();au();dpId=e.pointerId;try{dp.setPointerCapture(e.pointerId);}catch(_){}dz(e);});
dp.addEventListener('pointermove',function(e){if(e.pointerId===dpId){e.preventDefault();dz(e);}});
function dend(e){if(e.pointerId===dpId){dpId=null;dset(0,0,0);}}
dp.addEventListener('pointerup',dend);dp.addEventListener('pointercancel',dend);
function btn(id,fn){const b=document.getElementById(id);
  b.addEventListener('pointerdown',function(e){e.preventDefault();au();b.classList.add('on');fn();});
  ['pointerup','pointercancel','pointerleave'].forEach(function(n){b.addEventListener(n,function(){b.classList.remove('on');});});}
btn('bp',function(){pBuf=8;menu('ok');});
btn('bk',function(){kBuf=8;menu('alt');});
document.getElementById('mute').addEventListener('pointerdown',function(e){e.preventDefault();au();setMusic(!musicOn);});
setMusic(musicOn);

/* ================= loop ================= */
STAGES=[schoolStage(),gymStage()];
let last=0,acc=0;
function frameLoop(ts){
  const dt=Math.min(100,ts-last);last=ts;acc+=dt;let n=0;
  while(acc>=16.667&&n<5){update();acc-=16.667;n++;}
  if(n===5)acc=0;
  draw();requestAnimationFrame(frameLoop);
}
requestAnimationFrame(frameLoop);
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>

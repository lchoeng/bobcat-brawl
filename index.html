<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bobcat Brawl</title>
<meta name="theme-color" content="#000000">
<meta name="description" content="Bobcat Brawl: a retro arcade fighting game starring the Mary Bragg crew.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Bobcat Brawl">
<meta property="og:title" content="Bobcat Brawl">
<meta property="og:description" content="Retro arcade fighting game. Pick your fighter and take on the Mary Bragg crew!">
<meta property="og:image" content="https://lchoeng.github.io/bobcat-brawl/icon-512.png">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{display:block;width:100vw;max-width:calc((100dvh - 240px) * 1.714);aspect-ratio:384/224;background:#000;
  image-rendering:pixelated;image-rendering:crisp-edges}
#pad{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;padding:16px 14px 8px;box-sizing:border-box}
#dpad{width:144px;height:144px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:3px;touch-action:none}
#dpad .hub{grid-area:2/2;border-radius:6px;background:#111118;pointer-events:none}
.z{display:flex;align-items:center;justify-content:center;border-radius:10px;background:#1a1a22;color:#ddd;
  font-weight:900;font-size:22px;border:2px solid #555;pointer-events:none;box-shadow:inset 0 -4px 0 #000}
.z.up{grid-area:1/2;border-radius:10px 10px 4px 4px}.z.lf{grid-area:2/1;border-radius:10px 4px 4px 10px}.z.rt{grid-area:2/3;border-radius:4px 10px 10px 4px}.z.dn{grid-area:3/2;border-radius:4px 4px 10px 10px}
.z.on{background:#f2a71b;color:#1b2468;border-color:#f2a71b}
#mid{display:flex;flex-direction:column;align-items:center;gap:6px}
#mute{width:40px;height:40px;border-radius:50%;border:2px solid #555;background:#1a1a22;color:#f2a71b;font-size:18px;padding:0}
#btns{display:flex;flex-direction:column;gap:8px;align-items:stretch}
#brow{display:flex;gap:12px;align-items:flex-end}
#btns button{width:82px;height:82px;border-radius:50%;border:3px solid #111;color:#fff;font-weight:900;font-size:15px;
  letter-spacing:.5px;touch-action:none;font-family:inherit;padding:0;box-shadow:inset 0 -6px 0 rgba(0,0,0,.35),0 3px 0 #000;text-shadow:0 2px 0 rgba(0,0,0,.5)}
#bp{background:#d42a22;margin-bottom:26px}
#bk{background:#2456d6}
#btns #bs{width:auto;height:40px;border-radius:20px;background:#5a4a20;color:#e8d9a8;font-size:14px;letter-spacing:1px;margin:0;transition:background .2s}
#btns #bs.ready{background:#f2b51b;color:#1b2468;text-shadow:none;animation:glow .7s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 0 4px #ffd84a}to{box-shadow:inset 0 -6px 0 rgba(0,0,0,.25),0 0 18px #ffd84a}}
#btns button.on{filter:brightness(1.4);transform:translateY(2px)}
#hint{display:none;color:#9aa3c8;font-size:13px;padding:10px;text-align:center}
@media (orientation:landscape) and (max-height:520px){
  canvas{width:auto;height:100dvh;max-width:100vw}
  #pad{position:fixed;left:0;right:0;bottom:6px;max-width:none;padding:0 10px;opacity:.7}
  #dpad{width:120px;height:120px}
  #btns button{width:66px;height:66px;font-size:13px}
  #btns #bs{height:32px;font-size:12px}
  #mute{width:32px;height:32px;font-size:14px}
}
@media (hover:hover) and (pointer:fine){
  #pad{display:none} #hint{display:block}
  canvas{max-width:calc((100dvh - 60px) * 1.714)}
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="384" height="224"></canvas>
  <div id="pad">
    <div id="dpad">
      <div class="z up" id="zu">&#9650;</div>
      <div class="z lf" id="zl">&#9664;</div>
      <div class="hub"></div>
      <div class="z rt" id="zr">&#9654;</div>
      <div class="z dn" id="zd">&#9660;</div>
    </div>
    <div id="mid"><button id="mute" aria-label="Music on or off">&#9835;</button></div>
    <div id="btns">
      <button id="bs">&#9733; SPECIAL</button>
      <div id="brow"><button id="bk">KICK</button>
      <button id="bp">PUNCH</button></div>
    </div>
  </div>
  <div id="hint">&larr; &rarr; move &middot; &uarr; jump &middot; &darr; duck &middot; Z punch &middot; X kick &middot; C special &middot; Enter select &middot; hold away from your opponent to block &middot; M music</div>
</div>
<script>
'use strict';
const W=384,H=224,SW=560,MAXC=SW-W,GY=204;
const cv=document.getElementById('c');
const mainG=cv.getContext('2d');
let g=mainG;
g.imageSmoothingEnabled=false;
const OUT='#1a0e14',NAVY='#1b2468',GOLD='#f2a71b',SKIN='#efb487',HAIR='#2b1d18',FUR='#f39a1e',FURD='#b8620c',CREAM='#ffe2a8';
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),w,h);}
function rng(s){return function(){s=(s*1103515245+12345)&0x7fffffff;return s/0x7fffffff;};}

/* ================= colour helpers ================= */
const HX={},SHC={};
function hexA(c){if(HX[c])return HX[c];return HX[c]=[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];}
function toHex(a){return '#'+a.map(function(v){return Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0');}).join('');}
function shade(c,k){if(k===1)return c;const key=c+k;if(SHC[key])return SHC[key];const a=hexA(c);
  return SHC[key]=toHex(k<1?a.map(function(v){return v*k;}):a.map(function(v){return v+(255-v)*(k-1);}));}

/* ================= pixel font ================= */
const FD={A:'01110 10001 10001 11111 10001 10001 10001',B:'11110 10001 10001 11110 10001 10001 11110',C:'01110 10001 10000 10000 10000 10001 01110',
D:'11110 10001 10001 10001 10001 10001 11110',E:'11111 10000 10000 11110 10000 10000 11111',F:'11111 10000 10000 11110 10000 10000 10000',
G:'01110 10001 10000 10111 10001 10001 01111',H:'10001 10001 10001 11111 10001 10001 10001',I:'01110 00100 00100 00100 00100 00100 01110',
J:'00111 00010 00010 00010 00010 10010 01100',K:'10001 10010 10100 11000 10100 10010 10001',L:'10000 10000 10000 10000 10000 10000 11111',
M:'10001 11011 10101 10101 10001 10001 10001',N:'10001 10001 11001 10101 10011 10001 10001',O:'01110 10001 10001 10001 10001 10001 01110',
P:'11110 10001 10001 11110 10000 10000 10000',Q:'01110 10001 10001 10001 10101 10010 01101',R:'11110 10001 10001 11110 10100 10010 10001',
S:'01111 10000 10000 01110 00001 00001 11110',T:'11111 00100 00100 00100 00100 00100 00100',U:'10001 10001 10001 10001 10001 10001 01110',
V:'10001 10001 10001 10001 10001 01010 00100',W:'10001 10001 10001 10101 10101 10101 01010',X:'10001 10001 01010 00100 01010 10001 10001',
Y:'10001 10001 01010 00100 00100 00100 00100',Z:'11111 00001 00010 00100 01000 10000 11111',
'0':'01110 10001 10011 10101 11001 10001 01110','1':'00100 01100 00100 00100 00100 00100 01110','2':'01110 10001 00001 00010 00100 01000 11111',
'3':'11111 00010 00100 00010 00001 10001 01110','4':'00010 00110 01010 10010 11111 00010 00010','5':'11111 10000 11110 00001 00001 10001 01110',
'6':'00110 01000 10000 11110 10001 10001 01110','7':'11111 00001 00010 00100 01000 01000 01000','8':'01110 10001 10001 01110 10001 10001 01110',
'9':'01110 10001 10001 01111 00001 00010 01100','!':'00100 00100 00100 00100 00100 00000 00100','.':'00000 00000 00000 00000 00000 01100 01100',
',':'00000 00000 00000 00000 01100 00100 01000','?':'01110 10001 00001 00010 00100 00000 00100','-':'00000 00000 00000 11111 00000 00000 00000',
"'":'00100 00100 01000 00000 00000 00000 00000',':':'00000 01100 01100 00000 01100 01100 00000','/':'00001 00010 00010 00100 01000 01000 10000',
'"':'01010 01010 00000 00000 00000 00000 00000','<':'00010 00110 01110 11110 01110 00110 00010','>':'01000 01100 01110 01111 01110 01100 01000',' ':'00000 00000 00000 00000 00000 00000 00000'};
const FONT={};for(const k in FD)FONT[k]=FD[k].split(' ');
const TS={
  w:{f:['#ffffff'],o:OUT,ow:1},
  y:{f:['#fff6a8','#ffe86a','#ffd93a','#ffc928','#ffb51e','#ff9f18','#f58a12'],o:OUT,ow:1},
  gr:{f:['#9aa3c8'],o:OUT,ow:1},
  g:{grad:['#fffbe0','#fff07a','#ffd21f','#ffa214','#f26a12','#d8341a'],o:'#0d0a26',ow:2,sh:'#000000'},
  r:{grad:['#ffffff','#ffd4c4','#ff8460','#ee3020','#b81018'],o:'#0d0a26',ow:2,sh:'#000000'},
  b:{grad:['#ffffff','#cdeaff','#7cc0ff','#3a7ce8','#2240b0'],o:'#0d0a26',ow:2,sh:'#000000'},
  led:{f:['#ff3a2a'],ow:0},
  ko:{f:['#d01a1a'],ow:0},
  nv:{f:[NAVY],ow:0}
};
const TC={};
function textImg(s,sc,st,bold){
  s=String(s).toUpperCase();
  const key=s+'|'+sc+'|'+st+'|'+(bold?1:0);if(TC[key])return TC[key];
  const S=TS[st],ow=S.ow||0,sh=S.sh?Math.max(1,Math.round(sc*.6)):0,cell=bold?7:6;
  const tw=Math.max(1,s.length*cell*sc-sc),th=7*sc,w=tw+ow*2+sh,h=th+ow*2+sh;
  const m=new Uint8Array(w*h),o=new Uint8Array(w*h);
  for(let i=0;i<s.length;i++){const gl=FONT[s[i]]||FONT['?'];
    for(let r=0;r<7;r++)for(let c=0;c<5;c++)if(gl[r][c]==='1')
      for(let b=0;b<(bold?2:1);b++)for(let yy=0;yy<sc;yy++)for(let xx=0;xx<sc;xx++)
        m[(ow+r*sc+yy)*w+ow+(i*cell+c+b)*sc+xx]=1;}
  if(ow){for(let Y=0;Y<h;Y++)for(let X=0;X<w;X++)if(m[Y*w+X])for(let dy=-ow;dy<=ow;dy++)for(let dx=-ow;dx<=ow;dx++){const XX=X+dx,YY=Y+dy;if(XX>=0&&YY>=0&&XX<w&&YY<h)o[YY*w+XX]=1;}}
  else o.set(m);
  const cc=document.createElement('canvas');cc.width=w;cc.height=h;
  const x=cc.getContext('2d'),id=x.createImageData(w,h),d=id.data;
  function put(i,col){const c=hexA(col);d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2];d[i*4+3]=255;}
  if(sh)for(let Y=0;Y+sh<h;Y++)for(let X=0;X+sh<w;X++)if(o[Y*w+X])put((Y+sh)*w+X+sh,S.sh);
  if(ow)for(let i=0;i<w*h;i++)if(o[i])put(i,S.o);
  for(let Y=0;Y<h;Y++){const ry=Y-ow;let col;
    if(S.grad){const t=Math.max(0,Math.min(.999,ry/th));col=S.grad[Math.floor(t*S.grad.length)];}
    else col=S.f[Math.max(0,Math.min(S.f.length-1,Math.floor(ry/sc)))];
    for(let X=0;X<w;X++)if(m[Y*w+X])put(Y*w+X,col);}
  x.putImageData(id,0,0);
  return TC[key]=cc;
}
function txt(s,x,y,sc,st,al,bold){const im=textImg(s,sc||1,st||'w',bold);let X=x;if(al==='c')X=x-(im.width>>1);else if(al==='r')X=x-im.width;g.drawImage(im,Math.round(X),Math.round(y));return im.width;}

/* ================= sprite drawing kit ================= */
let sx=null,PAL=null;
function use(c){PAL.add(c);return c;}
function V(a,b){return [a[0]+b[0],a[1]+b[1]];}
function M(a,k){return [a[0]*k,a[1]*k];}
function L(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];}
function poly(pts){const p=new Path2D();p.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)p.lineTo(pts[i][0],pts[i][1]);p.closePath();return p;}
function ellP(cx,cy,rx,ry){const p=new Path2D();p.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);return p;}
function outside(cx,cy,rx,ry){const p=new Path2D();p.rect(-400,-400,800,800);p.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);return p;}
function px(x,y,w,h,c){sx.fillStyle=use(c);sx.fillRect(x,y,w,h);}
function nrm(a,b){let dx=b[0]-a[0],dy=b[1]-a[1];const l=Math.hypot(dx,dy)||1;dx/=l;dy/=l;let n=[-dy,dx];if(n[1]-n[0]<0)n=[dy,-dx];return {d:[dx,dy],n:n};}
function capPath(a,b,r){const p=new Path2D(),dx=b[0]-a[0],dy=b[1]-a[1];
  if(Math.hypot(dx,dy)<.01){p.arc(a[0],a[1],r,0,Math.PI*2);return p;}
  const an=Math.atan2(dy,dx);p.arc(a[0],a[1],r,an+Math.PI/2,an+Math.PI*1.5);p.arc(b[0],b[1],r,an-Math.PI/2,an+Math.PI/2);p.closePath();return p;}
function part(path,fn,sh,hl){
  sx.save();sx.clip(path);fn(1);
  if(sh){sx.save();sx.clip(sh);fn(.7);sx.restore();}
  if(hl){sx.save();sx.clip(hl);fn(1.28);sx.restore();}
  sx.restore();sx.lineJoin='round';sx.lineWidth=1.6;sx.strokeStyle=use(OUT);sx.stroke(path);
}
function cap(a,b,r,col,pat){
  const P=capPath(a,b,r),o=nrm(a,b),e=M(o.d,r+2),A0=V(a,M(e,-1)),B0=V(b,e),n=o.n;
  const sh=poly([V(A0,M(n,r*.22)),V(B0,M(n,r*.22)),V(B0,M(n,r*3)),V(A0,M(n,r*3))]);
  const hl=poly([V(A0,M(n,-r*.38)),V(B0,M(n,-r*.38)),V(B0,M(n,-r*.78)),V(A0,M(n,-r*.78))]);
  part(P,function(k){sx.fillStyle=use(shade(col,k));sx.fillRect(-400,-400,800,800);if(pat)pat(k,a,b,r);},sh,hl);
}
function solid(path,col,lw){sx.lineJoin='round';sx.lineWidth=lw||2.4;sx.strokeStyle=use(OUT);sx.stroke(path);sx.fillStyle=use(col);sx.fill(path);}
function ball(c,r,col){const P=ellP(c[0],c[1],r,r);
  part(P,function(k){sx.fillStyle=use(shade(col,k));sx.fillRect(-400,-400,800,800);},outside(c[0]+r*.35,c[1]-r*.4,r*1.02,r*1.02),ellP(c[0]+r*.3,c[1]-r*.45,r*.38,r*.28));}
function stripeAcross(col,step,lw){return function(k,a,b,r){const o=nrm(a,b),len=Math.hypot(b[0]-a[0],b[1]-a[1]);
  sx.strokeStyle=use(shade(col,k));sx.lineWidth=lw;sx.beginPath();
  for(let t=-r+1;t<len+r;t+=step){const m=V(a,M(o.d,t));sx.moveTo(m[0]+o.n[0]*(r+2),m[1]+o.n[1]*(r+2));sx.lineTo(m[0]-o.n[0]*(r+2),m[1]-o.n[1]*(r+2));}
  sx.stroke();};}
function plaidPat(col){return function(k,a,b,r){const o=nrm(a,b),len=Math.hypot(b[0]-a[0],b[1]-a[1]);
  sx.strokeStyle=use(shade(col,k));sx.lineWidth=1.2;sx.beginPath();
  for(let t=-r+2;t<len+r;t+=5){const m=V(a,M(o.d,t));sx.moveTo(m[0]+o.n[0]*(r+2),m[1]+o.n[1]*(r+2));sx.lineTo(m[0]-o.n[0]*(r+2),m[1]-o.n[1]*(r+2));}
  const s1=V(a,M(o.n,1.2)),s2=V(b,M(o.n,1.2));sx.moveTo(s1[0]-o.d[0]*9,s1[1]-o.d[1]*9);sx.lineTo(s2[0]+o.d[0]*9,s2[1]+o.d[1]*9);
  sx.stroke();};}

/* ================= fighters ================= */
const CH=[

const HAIRS={
 spiky:[[-8,4],[-9.5,-1],[-13,-4],[-9,-6.5],[-11,-11],[-5.5,-9.5],[-4.5,-14],[-.5,-10.5],[3,-14],[5,-9.8],[9.5,-10.5],[8,-6.5],[10,-4],[6.5,-4.6],[4.5,-3.6],[2,-5],[-.5,-3.5],[-3,-3],[-4.5,1],[-6,4.5]],

};

function face(mood,sk){
  const E='#1a1210';
  if(mood==='hurt'||mood==='beat'){px(0,-1,4,1,E);px(5,-1,2,1,E);px(-1,-4,3,1,E);px(2,-5,2,1,E);px(5,-4,2,1,E);}
  else{px(0,-2,4,3,'#ffffff');px(5,-2,2,3,'#ffffff');px(2,-2,2,3,E);px(6,-2,1,3,E);px(3,-2,1,1,'#ffffff');
    if(mood==='win'){px(-1,-4,4,1,E);px(5,-4,2,1,E);}

const IMG={};
function loadImgs(){return Promise.all(Object.keys(IMGD).map(function(k){return new Promise(function(res){const im=new Image();im.onload=function(){IMG[k]=im;res();};im.onerror=function(){res();};im.src=IMGD[k].d;});}));}
function kidPoses(p){return {idle:[p+'_idle'],walk:[p+'_run'],walkB:[p+'_idle',{rot:.04}],punch0:[p+'_idle',{rot:-.05}],punch1:[p+'_run',{rot:.12,dx:3}],kick0:[p+'_crouch'],kick1:[p+'_jump'],
 crouch:[p+'_crouch'],jump0:[p+'_jump'],jump1:[p+'_jump',{rot:.08}],jpunch:[p+'_run',{rot:.2}],jkick:[p+'_jump'],hit:[p+'_crouch',{rot:-.18,tint:1}],block:[p+'_crouch'],
 win0:[p+'_idle'],win1:[p+'_jump',{dy:-3}]};}
CH.forEach(function(c){if(!c.img)return;const P=kidPoses(c.img);if(c.poses)Object.assign(P,c.poses);c.poses=P;c.ref=c.img+'_idle';});
function poseSpec(c,key){
  const m=key.match(/^(idle|walk)(\d)$/);
  if(m&&m[1]==='idle'){const n=+m[2];return [c.poses.idle[0],{sq:1-n*.012}];}
  if(m){const n=+m[2];return n<2?[c.poses.walk[0],Object.assign({},c.poses.walk[1],{sq:n?.98:1})]:[c.poses.walkB[0],Object.assign({},c.poses.walkB[1],{sq:n===3?.98:1})];}
  if(key==='fall')return [c.poses.idle[0],{rot:-.9,tint:1}];
  if(key==='down')return [c.poses.idle[0],{lie:1}];
  return c.poses[key]||c.poses.idle;
}
function kidScale(c){const d=IMGD[c.ref];return (c.th||94)/(d.h*d.by);}
function drawKid(x,c,key,scl){
  const sp=poseSpec(c,key),k=sp[0],o=sp[1]||{},d=IMGD[k],im=IMG[k];if(!im)return;
  const s=kidScale(c)*scl*(o.sc||1),w=d.w*s,h=d.h*s;
  x.save();
  x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
  if(o.lie){x.translate(h*.5,-d.cx*w);x.rotate(-Math.PI/2);}
  else{x.translate((o.dx||0)*scl,(o.dy||0)*scl);if(o.rot)x.rotate(o.rot);if(o.sq)x.scale(1,o.sq);}
  if(d.f<0)x.scale(-1,1);
  x.drawImage(im,-d.cx*w,-d.by*h,w,h);
  x.restore();
}
function tintCanvas(cc,col){const x=cc.getContext('2d');x.save();x.globalCompositeOperation='source-atop';x.fillStyle=col;x.fillRect(0,0,cc.width,cc.height);x.restore();}
function renderKid(ci,key,scl,w,h,ox,oy){
  const c=CH[ci],cc=document.createElement('canvas');cc.width=w;cc.height=h;const x=cc.getContext('2d');
  x.translate(ox,oy);drawKid(x,c,key,scl);
  const sp=poseSpec(c,key);if(sp[1]&&sp[1].tint)tintCanvas(cc,'rgba(255,70,50,.33)');
  cc._ox=ox;cc._oy=oy;return cc;
}
function kidPortrait(ci,w,h,mood){
  const c=CH[ci],d=IMGD[c.ref],im=IMG[c.ref],cc=document.createElement('canvas');cc.width=w;cc.height=h;
  if(!im)return cc;
  const x=cc.getContext('2d');x.imageSmoothingEnabled=true;x.imageSmoothingQuality='high';
  const dh=h*2.25*(c.th?1.05:1),dw=dh*d.w/d.h;
  x.save();
  if(d.f<0){x.translate(w,0);x.scale(-1,1);}
  x.drawImage(im,w/2-d.hx*dw,h*.36-d.hy*dh,dw,dh);x.restore();
  if(mood==='beat'){tintCanvas(cc,'rgba(20,20,60,.38)');}
  return cc;
}
const SPW=128,SPH=128,SPOX=64,SPOY=124,SPR={};
function sprite(ci,key){const k=ci+key;return SPR[k]||(SPR[k]=CH[ci].img?renderKid(ci,key,1,180,140,90,134):renderFig(ci,key,1,SPW,SPH,SPOX,SPOY));}
const PORT={};
function portrait(ci,sc,w,h,mood){const key=ci+'|'+sc+'|'+w+'|'+h+'|'+mood;if(PORT[key])return PORT[key];
  if(CH[ci].img)return PORT[key]=kidPortrait(ci,w,h,mood);
  const c=CH[ci],P=POSE.idle0,s=sc*(c.scale||1);
  return PORT[key]=renderFig(ci,'idle0',sc,w,h,w*.5-P.hd[0]*s,h*.42-(P.hd[1]-3)*s,mood);}
const BIG={};
function bigWin(ci){return BIG[ci]||(BIG[ci]=CH[ci].img?renderKid(ci,'win0',1.45,200,240,90,234):renderFig(ci,'win0',1.45,200,240,90,234,'win'));}

const VX=W/2,HY=-140;
function proj(xw,y,cam){return Math.round(VX+(xw-cam-VX)*(y-HY)/(GY-HY));}
function mkLayer(w,fn){const o=document.createElement('canvas');o.width=Math.ceil(w);o.height=H;const old=g;g=o.getContext('2d');g.imageSmoothingEnabled=false;fn(o.width);g=old;return o;}
function pxEll(cx,cy,rx,ry,col){for(let y=-ry;y<=ry;y++){const hw=Math.round(rx*Math.sqrt(Math.max(0,1-(y*y)/(ry*ry))));R(cx-hw,cy+y,hw*2+1,1,col);}}
function cloud(x,y,s){pxEll(x,y+4,16*s,5*s,'#dbe9f7');pxEll(x-8*s,y,9*s,6*s,'#ffffff');pxEll(x+5*s,y-3*s,11*s,8*s,'#ffffff');pxEll(x+16*s,y+1,8*s,5*s,'#ffffff');R(x-20*s,y+5*s,44*s,2,'#c4d8ee');}
function tree(x,base){R(x+8,base-30,6,30,'#5a3c22');R(x+8,base-30,2,30,'#7a5432');pxEll(x+11,base-42,17,16,'#1f6a30');pxEll(x+9,base-46,14,13,'#2f8a3e');pxEll(x+6,base-50,8,7,'#4aa858');}
function person(X,Y,p,up){

function tryHit(f,o,a){
  if(o.st==='ko'||o.st==='win')return;
  const sc=f.c.scale||1,osc=o.c.scale||1,dx=(o.x-f.x)*f.face;
  if(dx<-4||dx>a.reach*sc+12*osc)return;
  const ay=f.y+a.hy*sc;
  if(ay<o.y+hurtTop(o)||ay>o.y+2)return;
  f.hitDone=true;
  const sxp=f.x+f.face*Math.max(8,Math.min(dx-8*osc,a.reach*sc)),syp=GY+ay;
  const blocking=o.back&&o.y>=0&&(o.st==='walk'||o.st==='idle'||o.st==='block'||o.st==='crouch');
  if(blocking){o.st='block';o.t=12;o.vx=f.face*2.2;sparks.push({x:sxp,y:syp,t:0,blk:true});SFX.block();hitstop=3;return;}
  const big=a.dmg>=9,arm=armored(o);
  o.hp-=a.dmg*f.c.pow*(arm?.6:1);if(!arm){o.vx=f.face*a.push;o.st='hit';o.t=a.stun;o.back=false;}
  f.sp=Math.min(100,f.sp+7);o.sp=Math.min(100,o.sp+4);
  if(!f.cpu)score+=a.pts;
  hitstop=big?7:5;shake=big?5:3;
  sparks.push({x:sxp,y:syp,t:0,big:big});
  if(o.hp<=0){o.hp=0;o.st='ko';o.t=0;o.vy=-6;o.vx=f.face*3;o.bounced=false;hitstop=16;shake=10;SFX.ko();}
  else if(big)SFX.big();else SFX.hit();
}

function hurtTop(o){return (o.st==='crouch'?-60:-96)*(o.c.scale||1);}
function armored(o){return o.st==='special'&&o.c.name==='DOM'&&o.t>=6&&o.t<54;}
function startSpec(f){f.st='special';f.t=0;f.sp=0;f.hitDone=false;f.back=false;f.vx=0;f.spName=70;f.spPose='punch0';flashT=8;if(!f.cpu)score+=100;SFX.special();}
function endSpec(f){f.st='idle';f.t=0;f.spPose=null;f.air=false;}
function shoot(f,p){p.own=f;p.t=0;p.hit=false;PJ.push(p);}
function specHit(f,o,a,sxp,syp,dir){
  if(o.st==='ko'||o.st==='win')return false;
  const blocking=o.back&&o.y>=0&&(o.st==='walk'||o.st==='idle'||o.st==='block'||o.st==='crouch');
  if(blocking){o.hp=Math.max(1,o.hp-2);o.st='block';o.t=14;o.vx=dir*2.6;sparks.push({x:sxp,y:syp,t:0,blk:true});SFX.block();hitstop=4;return true;}
  const arm=armored(o);
  o.hp-=a.dmg*f.c.pow*(arm?.6:1);
  if(!arm){o.st='hit';o.t=a.stun||22;o.vx=dir*(a.push||4);o.back=false;if(o.y<0)o.vy=Math.min(o.vy,-2);}
  if(!f.cpu)score+=a.pts||500;
  o.sp=Math.min(100,o.sp+6);
  hitstop=8;shake=7;sparks.push({x:sxp,y:syp,t:0,big:true,claw:!!a.claw});
  if(o.hp<=0){o.hp=0;o.st='ko';o.t=0;o.vy=-6;o.vx=dir*3;o.bounced=false;hitstop=18;shake=11;SFX.ko();}
  else SFX.big();
  return true;
}
function near(f,o,rx,top){const osc=o.c.scale||1;return Math.abs(o.x-f.x)<rx*osc&&o.y>top;}
function doSpecial(f,o){
  const n=f.c.name,t=++f.t,sc=f.c.scale||1,gr=f.y>=0&&f.vy>=0,hy=GY+f.y-60*sc;
  switch(n){
  case 'JAIDEN':
    f.spPose=t<8?'punch0':'punch1';
    if(t>=8&&t<26){f.vx=f.face*8.6;if(t%2===0)TRL.push({x:f.x,y:f.y,ci:f.ci,key:'punch1',face:f.face,t:0});
      if(!f.hitDone&&near(f,o,30,-70)){f.hitDone=true;specHit(f,o,{dmg:13,push:6.5,stun:26,pts:600},(f.x+o.x)/2,hy,f.face);}}
    else f.vx=0;
    if(t>=34)endSpec(f);break;
  case 'AVA':
    f.vx=0;f.spPose=t<10?'punch0':'punch1';
    if(t===10){shoot(f,{type:'cap',x:f.x+f.face*20,y:-66,vx:f.face*5.6,vy:0,dmg:11,boom:1,life:110});SFX.whoosh();}
    if(t>=26)endSpec(f);break;
  case 'LINUS':
    f.vx=0;f.spPose=t<12?'punch0':'punch1';
    if(t===12){shoot(f,{type:'fire',x:f.x+f.face*26,y:-68,vx:f.face*5.2,vy:0,dmg:13,life:130});SFX.fire();}
    if(t>=30)endSpec(f);break;
  case 'BOBCAT':
    if(t<10){f.vx=0;f.spPose='block';}
    else if(t===10){f.vy=-6.8;f.y=-.1;f.vx=f.face*6.4;f.air=true;f.spPose='jpunch';SFX.jump();}
    else{f.spPose=f.vy<1?'jpunch':'jkick';if(t%2===0)TRL.push({x:f.x,y:f.y,ci:f.ci,key:f.spPose,face:f.face,t:0});
      if(!f.hitDone&&Math.abs(o.x-f.x)<34*sc&&f.y-o.y>-100&&f.y-o.y<30){f.hitDone=true;specHit(f,o,{dmg:15,push:6,stun:28,pts:700,claw:1},(f.x+o.x)/2,hy+10,f.face);}
      if(gr&&t>12){f.vx=0;endSpec(f);}}
    if(t>90)endSpec(f);break;
  case 'DOM':
    f.spPose=t<6?'punch0':((t>>2)&1)?'punch1':'kick1';
    if(t>=6&&t<54){f.vx=f.face*2.8;if(t%12===6)f.hitDone=false;
      if(!f.hitDone&&near(f,o,36,-80)){f.hitDone=true;specHit(f,o,{dmg:5,push:2.6,stun:16,pts:250},(f.x+o.x)/2,hy,f.face);}
      if(t%8===0)SFX.whoosh();}
    else f.vx=0;
    if(t>=62)endSpec(f);break;
  case 'AUDREY':
    f.vx=0;f.spPose=t<12?'kick0':'punch1';
    if(t===12){shoot(f,{type:'bolt',x:o.x,y:0,vx:0,vy:0,dmg:15,life:44,warn:22});SFX.charge();}
    if(t>=34)endSpec(f);break;
  case 'AYLA':
    f.vx=0;f.spPose=t<8?'punch0':'punch1';
    if(t===10||t===17||t===24){shoot(f,{type:'star',x:f.x+f.face*20,y:-72,vx:f.face*4.9,vy:[-2.1,-.9,.2][(t-10)/7],g:.05,dmg:6,stun:16,push:2.5,life:120});SFX.star();}
    if(t>=34)endSpec(f);break;
  case 'WESLEY':
    f.vx=0;f.spPose=t<6?'punch0':'win0';
    if(t===10){shoot(f,{type:'roar',x:f.x+f.face*20,y:-46,vx:f.face*4.3,vy:0,dmg:12,stun:36,push:6.5,life:72});SFX.roar();}
    if(t>=42)endSpec(f);break;
  default:endSpec(f);
  }
}
function updPJ(){
  for(let i=PJ.length-1;i>=0;i--){const p=PJ[i],o=p.own===p1?p2:p1;p.t++;
    if(p.type==='bolt'){
      if(p.t<p.warn)p.x+=(o.x-p.x)*.04;
      if(p.t===p.warn){shake=6;SFX.zap();if(Math.abs(o.x-p.x)<26*(o.c.scale||1)&&o.y>-50)specHit(p.own,o,{dmg:p.dmg,push:3,stun:30,pts:700},o.x,GY+o.y-50,o.x>=p.own.x?1:-1);}
      if(p.t>=p.life)PJ.splice(i,1);continue;}
    p.x+=p.vx;p.y+=p.vy;if(p.g)p.vy+=p.g;
    if(p.boom&&p.t===42)p.vx=-p.vx*1.1;
    let dead=p.t>=p.life||p.x<-30||p.x>SW+30||p.y>4;
    if(p.boom&&p.t>42&&Math.abs(p.x-p.own.x)<16)dead=true;
    if(!dead&&o.st!=='ko'){const osc=o.c.scale||1,r=p.type==='roar'?20:14;
      if(Math.abs(p.x-o.x)<r*osc&&p.y>o.y+hurtTop(o)&&p.y<o.y+6){specHit(p.own,o,{dmg:p.dmg,push:p.push||4.5,stun:p.stun||24,pts:500},p.x,GY+p.y,p.vx>=0?1:-1);dead=true;}}
    if(!dead)for(let j=0;j<PJ.length;j++){const q=PJ[j];if(q!==p&&q.own!==p.own&&q.type!=='bolt'&&Math.abs(q.x-p.x)<14&&Math.abs(q.y-p.y)<18){sparks.push({x:(p.x+q.x)/2,y:GY+(p.y+q.y)/2,t:0,big:true});SFX.block();PJ.splice(Math.max(i,j),1);PJ.splice(Math.min(i,j),1);i=Math.min(i,PJ.length);dead=false;p.gone=1;break;}}
    if(p.gone)continue;
    if(dead)PJ.splice(i,1);
  }
  for(let i=TRL.length-1;i>=0;i--)if(++TRL[i].t>10)TRL.splice(i,1);
}
function star5(X,Y,r,rot,c1,c2){g.save();g.translate(X,Y);g.rotate(rot);g.beginPath();for(let k=0;k<10;k++){const rr=k&1?r*.45:r,a=k*Math.PI/5-Math.PI/2;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr);}g.closePath();g.fillStyle=c1;g.fill();g.lineWidth=1.2;g.strokeStyle=c2;g.stroke();g.restore();}
function drawPJ(){
  TRL.forEach(function(r){g.save();g.globalAlpha=.42*(1-r.t/10);drawSpr(sprite(r.ci,r.key),r.x-cam,GY+r.y,r.face);g.restore();
    if(CH[r.ci].name==='JAIDEN'&&r.t<4){const X=r.x-cam,Y=GY+r.y-50;g.strokeStyle='#bfe8ff';g.lineWidth=1.5;g.beginPath();g.moveTo(X-8,Y-12);g.lineTo(X+2,Y-4);g.lineTo(X-4,Y+2);g.lineTo(X+8,Y+12);g.stroke();}});
  PJ.forEach(function(p){const X=p.x-cam,Y=GY+p.y,t=p.t;
    switch(p.type){
    case 'fire':{for(let k=4;k>=1;k--){g.fillStyle=['#fff6b0','#ffd23a','#ff9a1a','#e8460c'][k-1];g.globalAlpha=k===4?.5:1;g.beginPath();g.arc(X-p.vx*k*1.3,Y+Math.sin(t*.6+k)*1.5,9-k*1.6+(k===1?2:0),0,7);g.fill();}g.globalAlpha=1;
      g.fillStyle='#fffbe0';g.beginPath();g.arc(X,Y,4.5,0,7);g.fill();
      for(let k=0;k<3;k++){g.fillStyle='#ffb020';g.fillRect(Math.round(X-p.vx*(3+k*2)+Math.sin(t+k*2)*3),Math.round(Y+Math.cos(t*.8+k)*6),2,2);}break;}
    case 'cap':{g.save();g.translate(X,Y);g.rotate(t*.5*(p.vx>0?1:-1));g.fillStyle='#1a1d3a';g.beginPath();g.ellipse(0,0,11,4,0,0,7);g.fill();
      g.fillStyle='#283a8c';g.beginPath();g.arc(0,-1,7,Math.PI,0);g.fill();g.strokeStyle='#0c0e22';g.lineWidth=1.2;g.stroke();g.fillStyle='#ffffff';g.fillRect(-1,-8,2,2);g.restore();
      g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=1;g.beginPath();g.arc(X,Y,13,0,7);g.stroke();break;}
    case 'star':{star5(X,Y,8,t*.3,'#ffe14a','#7a3fd0');for(let k=1;k<4;k++){g.fillStyle=k&1?'#c9a8ff':'#fff6b0';g.fillRect(Math.round(X-p.vx*k*2.4),Math.round(Y-p.vy*k*2.4+Math.sin(t+k)*2),2,2);}break;}
    case 'roar':{const r0=Math.min(1,t/8);for(let k=0;k<3;k++){const rr=(10+k*6)*r0,a=p.vx>0?0:Math.PI;g.strokeStyle=['#ffffff','#bfe6ff','#6fbaff'][k];g.lineWidth=3-k*.6;g.globalAlpha=1-k*.25;g.beginPath();g.arc(X-p.vx*k*1.5,Y,rr,a-1,a+1);g.stroke();}g.globalAlpha=1;
      if(t<30)txt('ROAR!',X,Y-30,1,'y','c',true);break;}
    case 'bolt':{const gx=X;if(t<p.warn){const k=(t>>2)&1;g.fillStyle=k?'rgba(255,240,90,.55)':'rgba(255,170,40,.45)';g.beginPath();g.ellipse(gx,GY+1,16+t*.2,4,0,0,7);g.fill();
        g.strokeStyle='rgba(180,220,255,.6)';g.lineWidth=1;g.beginPath();g.moveTo(gx,0);g.lineTo(gx,GY);g.setLineDash([3,5]);g.stroke();g.setLineDash([]);}
      else if(t<p.warn+12){const pts=[];let yy=0,xx=gx;while(yy<GY){pts.push([xx,yy]);yy+=14;xx=gx+((yy*7919+t*13)%17-8);}pts.push([gx,GY]);
        [['#6fb8ff',7],['#d8f0ff',3.5],['#ffffff',1.6]].forEach(function(s){g.strokeStyle=s[0];g.lineWidth=s[1];g.lineJoin='round';g.beginPath();pts.forEach(function(q,i){if(i)g.lineTo(q[0],q[1]);else g.moveTo(q[0],q[1]);});g.stroke();});
        g.fillStyle='rgba(220,240,255,.85)';g.beginPath();g.ellipse(gx,GY,22,6,0,0,7);g.fill();
        if(t<p.warn+3){g.fillStyle='rgba(255,255,255,.35)';g.fillRect(0,0,W,H);}}
      break;}
    }});
}
function stepF(f,o,i){
  f.anim++;
  const c=f.c,gr=f.y>=0&&f.vy>=0;
  if(f.st==='ko'||f.st==='win')f.t++;
  else if(f.st==='hit'||f.st==='block'){if(--f.t<=0)f.st=gr?'idle':'jump';}
  else if(f.st==='special')doSpecial(f,o);
  else if(f.st==='punch'||f.st==='kick'){
    const a=ATK[f.st];f.t++;
    if(f.air){if(f.t>a.st&&f.t<=a.st+14&&!f.hitDone)tryHit(f,o,ATK['j'+f.st]);}
    else{f.vx=0;if(f.t>a.st&&f.t<=a.st+a.ac&&!f.hitDone)tryHit(f,o,a);if(f.t>=a.st+a.ac+a.rc)f.st='idle';}
  }else{
    if(gr){
      f.face=o.x>=f.x?1:-1;
      const mv=(i.r?1:0)-(i.l?1:0),fwd=mv===f.face;
      f.vx=mv*(fwd?2.1:1.7)*c.spd;f.st=mv?'walk':'idle';f.back=mv!==0&&!fwd;
      if(i.d&&!i.u){f.vx=0;f.st='crouch';}
      if(i.u){f.vy=-8.6;f.vx=mv*2.7*c.spd;f.st='jump';f.back=false;if(!f.cpu)SFX.jump();}
    }else f.back=false;
    if(i.s&&f.sp>=100&&gr){startSpec(f);}
    else if(i.p||i.k){f.st=i.p?'punch':'kick';f.t=0;f.hitDone=false;f.air=!(f.y>=0&&f.vy>=0);f.back=false;SFX.swing();}
  }
  if(f.y<0||f.vy<0){
    f.y+=f.vy;f.vy+=.45;
    if(f.y>=0){f.y=0;f.vy=0;
      if(f.st==='jump')f.st='idle';
      if((f.st==='punch'||f.st==='kick')&&f.air){f.st='idle';f.air=false;}
      if(f.st==='special'&&f.c.name!=='BOBCAT'){f.vx=0;}
      if(f.st==='ko'){f.vx*=.4;if(!f.bounced){f.bounced=true;f.vy=-2.6;f.y=-.1;shake=5;SFX.thud();}}
    }
  }
  f.x+=f.vx;
  if(f.y>=0&&(f.st==='hit'||f.st==='block'||f.st==='ko'||f.st==='win'))f.vx*=.8;
  if(f.spName>0)f.spName--;
  if(f.st!=='special'&&f.st!=='ko'&&f.st!=='win')f.sp=Math.min(100,f.sp+.36);
  f.dhp+=(f.hp-f.dhp)*.06;
}
function separate(){
  if(p1.st==='ko'||p2.st==='ko')return;
  if(p1.y<-40||p2.y<-40)return;
  const min=13*((p1.c.scale||1)+(p2.c.scale||1)),dx=p2.x-p1.x,d=Math.abs(dx);
  if(d<min){const push=(min-d)/2,s=dx>=0?1:-1;p1.x-=push*s;p2.x+=push*s;}
}
function camUpd(){
  cam=Math.max(0,Math.min(MAXC,(p1.x+p2.x)/2-W/2));
  [p1,p2].forEach(function(f){const lo=Math.max(22,cam+22),hi=Math.min(SW-22,cam+W-22);if(f.x<lo)f.x=lo;if(f.x>hi)f.x=hi;});
}
function ai(f,o){
  const i={l:0,r:0,u:0,p:0,k:0};
  const lvl=Math.min(1.25,.5+.09*li+.12*(round-1));
  const dx=o.x-f.x,d=Math.abs(dx),tw=dx>0?'r':'l',aw=dx>0?'l':'r',sc=f.c.scale||1;
  if(f.st==='jump'){if(d<64&&f.vy>0&&Math.random()<.15)i.k=1;return i;}
  if(f.st==='crouch'){if(f.duckT>0){f.duckT--;i.d=1;}return i;}
  if(f.st!=='idle'&&f.st!=='walk')return i;
  for(const p of PJ){if(p.own!==f&&p.type!=='bolt'&&p.y<-58&&Math.abs(p.x-f.x)<90&&(p.x-f.x)*p.vx<0&&!p.seen){p.seen=1;if(Math.random()<.45*lvl){f.duckT=24;i.d=1;return i;}}}
  if(f.sp>=100&&o.st!=='ko'&&Math.random()<.018*lvl){const melee=f.c.name==='JAIDEN'||f.c.name==='BOBCAT'||f.c.name==='DOM';if(!melee||d<150){i.s=1;return i;}}
  f.aiT--;
  const oAtk=(o.st==='punch'||o.st==='kick')&&o.t<8;
  if(oAtk&&d<70&&f.plan!=='block'&&Math.random()<.22*lvl){f.plan='block';f.aiT=20;}
  if(f.aiT<=0){
    const r=Math.random();f.fire=true;
    if(d>120){f.plan=r<.7?'approach':r<.85?'jump':'wait';f.aiT=16+Math.random()*24;}
    else if(d>55){f.plan=r<.4?'approach':r<.68?'kick':r<.8?'jump':r<.9?'wait':'retreat';f.aiT=22+Math.random()*20;}
    else{f.plan=r<.34?'punch':r<.62?'kick':r<.76?'retreat':r<.86?'block':'wait';f.aiT=24+Math.random()*26;}
    f.aiT/=(.6+.5*lvl);
  }
  switch(f.plan){
    case 'approach':i[tw]=1;if(d<40)f.aiT=0;break;
    case 'retreat':case 'block':i[aw]=1;break;
    case 'jump':if(f.fire)i.u=1;i[tw]=1;break;
    case 'punch':if(d>ATK.punch.reach*sc+8)i[tw]=1;else{i.p=1;f.plan='wait';f.aiT=Math.max(f.aiT,14/lvl);}break;
    case 'kick':if(d>ATK.kick.reach*sc+8)i[tw]=1;else{i.k=1;f.plan='wait';f.aiT=Math.max(f.aiT,16/lvl);}break;
  }
  f.fire=false;return i;
}
function readPlayer(){return {l:held.l||touch.l,r:held.r||touch.r,u:held.u||touch.u,d:held.d||touch.d,p:pBuf>0,k:kBuf>0&&!(pBuf>0),s:sBuf>0};}

/* ================= update ================= */
function warm(){let n=0;for(const ci of [pick1,opp])for(const k of POSE_KEYS){if(!SPR[ci+k]){sprite(ci,k);if(++n>=4)return;}}}
function update(){
  tick++;
  switch(scene){
    case 'select':
      if(selPhase==='roul'){selT++;
        const iv=selT<30?4:selT<50?7:11;
        if(selT<70&&selT%iv===0){let n;do{n=(Math.random()*8)|0;}while(n===pick1||n===cpuCur);cpuCur=n;SFX.move();}
        if(selT===70){cpuCur=ladder[0];SFX.ok();}
        if(selT>=125)startMatch();}
      return;
    case 'vs':warm();if(tick>150){go('fight');startRound();mStart();}return;
    case 'continue':if(tick%60===0){contN--;if(contN>=0)SFX.move();}if(contN<0){saveHi();go('gameover');}return;
    case 'gameover':if(tick>240)go('title');return;
    case 'ending':if(tick%3===0)confetti.push({x:Math.random()*W,y:-4,v:.6+Math.random()*1.2,c:[GOLD,'#ffffff','#d42a22','#2456d6','#ff7fb0'][(Math.random()*5)|0]});
      confetti.forEach(function(c){c.y+=c.v;c.x+=Math.sin((c.y+c.v*50)*.08)*.5;});confetti=confetti.filter(function(c){return c.y<H;});return;
    case 'fight':break;
    default:return;
  }
  phaseT++;
  if(shake>0)shake-=.5;
  if(flashT>0)flashT--;
  for(let i=sparks.length-1;i>=0;i--){if(++sparks[i].t>12)sparks.splice(i,1);}
  if(hitstop>0){hitstop--;return;}
  if(phase==='intro'){
    stepF(p1,p2,NOIN);stepF(p2,p1,NOIN);
    if(phaseT===70)SFX.bell();
    if(phaseT>=110){phase='fight';pBuf=kBuf=sBuf=0;}
  }else if(phase==='fight'){
    timer--;if(pBuf>0)pBuf--;if(kBuf>0)kBuf--;if(sBuf>0)sBuf--;
    stepF(p1,p2,readPlayer());
    if((p1.st==='punch'||p1.st==='kick'||p1.st==='special')&&p1.t===0){pBuf=0;kBuf=0;sBuf=0;}
    stepF(p2,p1,ai(p2,p1));
    updPJ();
    separate();
    if(p2.hp<=0)endRound(p1,false);else if(p1.hp<=0)endRound(p2,false);
    else if(timer<=0){const a=p1.hp/p1.c.hp,b=p2.hp/p2.c.hp;endRound(a>b?p1:b>a?p2:null,true);}
  }else if(phase==='ko'){
    if(!(phaseT<60&&phaseT%3)){stepF(p1,p2,NOIN);stepF(p2,p1,NOIN);}
    if(phaseT===90&&rw){rw.st='win';rw.t=0;rw.vx=0;}
    if(phaseT>=250){
      if(rw&&rw.wins>=2){mw=rw;saveHi();go('quote');}
      else{if(rw)round++;startRound();}
    }
  }
  camUpd();
}

function poseKey(f){
  switch(f.st){
    case 'ko':return f.y<0?'fall':'down';
    case 'win':return (f.anim>>4)&1?'win1':'win0';
    case 'special':return f.spPose||'punch1';
    case 'crouch':return 'crouch';
    case 'hit':return 'hit';
    case 'block':return 'block';
    case 'punch':case 'kick':{const a=ATK[f.st];
      if(f.air)return f.t>a.st?'j'+f.st:'jump0';
      return f.t>=a.st&&f.t<=a.st+a.ac+2?f.st+'1':f.st+'0';}
    case 'jump':return f.vy<0?'jump0':'jump1';
    case 'walk':return 'walk'+((f.anim>>3)&3);
    default:return 'idle'+[0,1,2,1][(f.anim>>3)&3];
  }
}
function drawSpr(img,x,y,face){
  const ox=img._ox||SPOX,oy=img._oy||SPOY;

function endQuote(){
  if(mw===p1){li++;if(li>=ladder.length){saveHi();confetti=[];go('ending');SFX.ok();}else startMatch();}
  else{contN=9;go('continue');}
}
function doContinue(){
  score=0;ladder=ladder.slice(0,li).concat(shuffle(ladder.slice(li)));SFX.ok();startMatch();
}
function menu(k){
  au();
  switch(scene){
    case 'title':if(k==='ok'||k==='alt'){go('select');SFX.ok();}break;
    case 'select':if(selPhase!=='pick')return;
      if(k==='l'){sel=(sel+7)%8;SFX.move();}else if(k==='r'){sel=(sel+1)%8;SFX.move();}
      else if(k==='u'||k==='d'){sel=sel<4?sel+4:sel-4;SFX.move();}
      else if(k==='ok'||k==='alt')confirmSel();
      break;
    case 'quote':if((k==='ok'||k==='alt')&&tick>30)endQuote();break;
    case 'continue':if(k==='ok'||k==='alt')doContinue();break;
    case 'gameover':case 'ending':if((k==='ok'||k==='alt')&&tick>60)go('title');break;
  }
}

});

/* ================= loop ================= */
STAGES=[schoolStage(),gymStage()];
let last=0,acc=0;
function frameLoop(ts){
  const dt=Math.min(100,ts-last);last=ts;acc+=dt;let n=0;
  while(acc>=16.667&&n<5){update();acc-=16.667;n++;}
  if(n===5)acc=0;
  draw();requestAnimationFrame(frameLoop);
}

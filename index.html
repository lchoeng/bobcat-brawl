<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1b2468">
<meta name="description" content="Bobcat Brawl: a retro punch-and-kick fighting game starring the Mary Bragg crew.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bobcat Brawl">
<meta property="og:title" content="Bobcat Brawl">
<meta property="og:description" content="Retro punch-and-kick fighting game. Pick your fighter!">
<meta property="og:image" content="icons/icon-512.png">
<title>Bobcat Brawl</title>
<style>
html,body{margin:0;height:100%;background:#0b1030;overflow:hidden;touch-action:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
canvas{display:block;width:100vw;max-width:calc((100dvh - 190px) * 1.6);aspect-ratio:320/200;background:#000;
  border-top:3px solid #f2a71b;border-bottom:3px solid #f2a71b;box-sizing:border-box}
#pad{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;
  padding:16px 16px 8px;box-sizing:border-box}
#dpad{width:156px;height:132px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:42% 58%;gap:6px;touch-action:none}
.z{display:flex;align-items:center;justify-content:center;border-radius:12px;background:#1b2468;color:#f2a71b;
  font-weight:900;font-size:22px;border:2px solid #f2a71b;pointer-events:none}
.z.up{grid-column:1/3;font-size:14px;letter-spacing:1px}
.z.on{background:#f2a71b;color:#1b2468}
#btns{display:flex;gap:12px;align-items:flex-end}
#btns button{width:82px;height:82px;border-radius:50%;border:3px solid #fff;color:#fff;font-weight:900;font-size:15px;
  letter-spacing:.5px;touch-action:none;font-family:inherit;padding:0}
#bp{background:#d42a22;margin-bottom:26px}
#bk{background:#2456d6}
#btns button.on{filter:brightness(1.5);transform:scale(.94)}
#hint{display:none;color:#c9d2ff;font-size:13px;padding:12px;text-align:center}
@media (orientation:landscape) and (max-height:520px){
  canvas{width:auto;height:100dvh;max-width:100vw;border:0}
  #pad{position:fixed;left:0;right:0;bottom:6px;max-width:none;padding:0 10px;opacity:.72}
  #dpad{width:128px;height:108px}
  #btns button{width:68px;height:68px;font-size:13px}
}
@media (hover:hover) and (pointer:fine){
  #pad{display:none} #hint{display:block}
  canvas{max-width:calc((100dvh - 60px) * 1.6)}
}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="600"></canvas>
  <div id="pad">
    <div id="dpad">
      <div class="z up" id="zu">&#9650; JUMP</div>
      <div class="z" id="zl">&#9664;</div>
      <div class="z" id="zr">&#9654;</div>
    </div>
    <div id="btns">
      <button id="bk">KICK</button>
      <button id="bp">PUNCH</button>
    </div>
  </div>
  <div id="hint">Keyboard: &larr; &rarr; move &middot; &uarr; jump &middot; Z punch &middot; X kick &middot; Enter select &middot; hold away from your opponent to block</div>
</div>
<script>
'use strict';
const cv=document.getElementById('c');
const mainG=cv.getContext('2d');
let g=mainG;
const W=320,H=200,S=3,GY=180,FS=1.5;
mainG.setTransform(S,0,0,S,0,0);
mainG.imageSmoothingEnabled=false;

const NAVY='#1b2468',GOLD='#f2a71b';
function R(x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h);}
function T(s,x,y,size,fill,stroke,align,sw){
  g.font='italic 900 '+size+'px Impact,"Arial Black","Helvetica Neue",system-ui,sans-serif';
  g.textAlign=align||'center';g.textBaseline='middle';g.lineJoin='round';
  if(stroke){g.lineWidth=sw||3;g.strokeStyle=stroke;g.strokeText(s,x,y);}
  g.fillStyle=fill;g.fillText(s,x,y);
}

/* ---------- fighters ---------- */
const SK='#f2b27a',HAIR='#2a1c16',FUR='#f39a1e',FURD='#c8720f';
const CH=[
 {name:'JAIDEN',tag:'THE BLUE BOLT',spd:1.15,pow:.95,hp:100,shirt:'stripes',c1:'#1f3f9a',c2:'#8fb4ee',pants:'#6c7480',shoe:'#23262e',sole:'#0e0f13',band:'#e02b2b',glove:'#e02b2b'},
 {name:'AVA',tag:'CAP CRUSHER',spd:1.1,pow:1,hp:100,shirt:'plaid',c1:'#d42a22',c2:'#2f8f55',pants:'#f1f1f1',shorts:true,shoe:'#ffffff',sole:'#b9bdc6',long:26,cap:'#2456d6',glove:'#2456d6'},
 {name:'LINUS',tag:'GOLDEN FIST',spd:1,pow:1.1,hp:100,shirt:'plain',c1:'#d39a32',pants:'#8a7a4e',shoe:'#4a3b2c',sole:'#2a2018',band:'#1c2a6b',glove:'#f7d51d'},
 {name:'BOBCAT',tag:'THE BIG CAT',spd:.85,pow:1.25,hp:120,cat:true,scale:1.2,shirt:'sweater',c1:NAVY,pants:FUR,shoe:FUR,sole:FURD,band:'#f7d51d',glove:'#ffb84a',skin:FUR},
 {name:'DOM',tag:'IRON JACKET',spd:.95,pow:1.15,hp:100,shirt:'jacket',c1:'#d8c79a',c2:'#d9f2e8',pants:'#2b5fb0',shoe:'#e9edf2',sole:'#aab2bd',band:'#2f8f55',glove:'#2f8f55'},
 {name:'AUDREY',tag:'PINK LIGHTNING',spd:1.2,pow:.9,hp:100,shirt:'tee',c1:'#e3d2f4',emb:'#ff7fb0',heart:true,pants:'#8f86e0',shorts:true,shoe:'#f0567f',sole:'#fff',long:26,band:'#ff5fa2',glove:'#ff5fa2'},
 {name:'AYLA',tag:'STAR STRIKER',spd:1.1,pow:1,hp:100,shirt:'tee',c1:'#f0e4fa',emb:'#6b3fb5',pants:'#8f86e0',shorts:true,shoe:'#f0567f',sole:'#fff',long:30,band:'#7a4fd0',glove:'#7a4fd0'}
];
const ATK={
  punch:{start:5,active:4,rec:9,reach:19,dmg:7,push:2.2,stun:14,hy:-26},
  kick:{start:8,active:5,rec:13,reach:26,dmg:10,push:3.2,stun:18,hy:-17}
};

function drawChar(c,x,y,face,p,anim,sc){
  sc=(sc||1)*(c.scale||1);
  const st=p.st,ext=!!p.ext,air=!!p.air;
  const skin=c.skin||SK;
  g.save();
  g.translate(Math.round(x),Math.round(y));
  g.scale(face*sc,sc);
  if(st==='ko'){g.translate(0,-8);g.rotate(-Math.PI/2*Math.min(1,(p.t||0)/12));}
  let bob=0,bx=0;
  if(st==='idle')bob=(anim>>4)&1;
  if(st==='walk')bob=(anim>>3)&1;
  if(st==='hit'||st==='ko')bx=-2;
  if(st==='kick'&&ext)bx=-3;
  if(st==='punch'&&ext)bx=2;
  if(st==='win')bob=-((anim>>3)&1)*3;
  const mood=(st==='hit'||st==='ko')?'hurt':((ext||st==='win')?'open':'smile');
  const fl=(anim>>3)&1;

  function seg(x,y,w,h,fore){
    const tee=c.shirt==='tee';
    R(x,y,w,h,(tee&&fore)?skin:c.c1);
    if(c.shirt==='stripes'){
      if(w>h){for(let i=1;i<w;i+=4)R(x+i,y,2,h,c.c2);}
      else{for(let i=1;i<h;i+=4)R(x,y+i,w,2,c.c2);}
    }
  }
  function leg(x,l){
    const len=9-l;
    if(c.shorts){R(x,-13,5,4,c.pants);R(x,-9,5,Math.max(0,len-4),skin);}
    else R(x,-13,5,Math.max(1,len),c.pants);
    R(x,-4-l,7,4,c.shoe);R(x,-1-l,7,1,c.sole);
    if(c.cat){R(x+5,-3-l,1,2,FURD);R(x+3,-3-l,1,2,FURD);}
  }

  // tail / long hair (behind everything)
  if(c.cat){R(-13+bx,-13,6,4,FUR);R(-17+bx,-19-fl,4,9,FUR);R(-17+bx,-21-fl,4,3,FURD);}
  if(c.long){R(-12+bx,-45+bob,7,c.long,HAIR);R(-13+bx,-40+bob,2,c.long-9,HAIR);}

  // far arm
  if(st==='win'){seg(6+bx,-37+bob,3,11,true);R(5+bx,-42+bob,5,5,c.glove);}
  else if(st==='block'){seg(7,-29+bob,4,6,true);R(8,-36+bob,5,7,c.glove);}
  else if(st==='hit'||st==='ko'){seg(3+bx,-29+bob,8,3,true);R(10+bx,-32+bob,4,5,c.glove);}
  else{seg(3+bx,-24+bob,6,3,true);R(8+bx,-27+bob,4,5,c.glove);}

  // legs
  let l1=0,l2=0;
  if(st==='walk'){const k=(anim>>3)&3;l1=k===1?3:0;l2=k===3?3:0;}
  if(air&&st!=='ko'){l1=5;l2=3;}
  leg(-8,l1);
  if(st==='kick'&&ext){
    if(c.shorts){R(1,-18,6,5,c.pants);R(7,-18,9,5,skin);}else R(1,-18,15,5,c.pants);
    R(16,-20,5,8,c.shoe);R(20,-20,1,8,c.sole);
  }else leg(2,l2);

  // torso
  (function(){
    const tx=-7+bx,ty=-27+bob;
    R(tx,ty,14,14,c.c1);
    const D='#7a120e';
    switch(c.shirt){
      case 'stripes':for(let i=1;i<14;i+=4)R(tx,ty+i,14,2,c.c2);break;
      case 'plaid':R(tx+7,ty,5,14,c.c2);R(tx+2,ty,1,14,D);R(tx+5,ty,1,14,D);R(tx+13,ty,1,14,D);
        R(tx,ty+4,7,1,D);R(tx,ty+9,7,1,D);R(tx+12,ty+4,2,1,D);R(tx+12,ty+9,2,1,D);break;
      case 'jacket':R(tx+7,ty,5,14,c.c2);R(tx+7,ty+2,5,1,'#6fc0a8');R(tx+7,ty+6,5,1,'#6fc0a8');R(tx+7,ty+10,5,1,'#6fc0a8');
        R(tx+5,ty+3,1,1,'#8a7a55');R(tx+5,ty+7,1,1,'#8a7a55');R(tx+5,ty+11,1,1,'#8a7a55');break;
      case 'tee':
        if(c.heart){R(tx+6,ty+4,2,2,c.emb);R(tx+9,ty+4,2,2,c.emb);R(tx+6,ty+5,5,2,c.emb);R(tx+7,ty+7,3,1,c.emb);R(tx+8,ty+8,1,1,c.emb);}
        else{R(tx+6,ty+5,5,2,c.emb);R(tx+8,ty+3,1,6,c.emb);R(tx+7,ty+4,3,4,c.emb);}
        break;
      case 'sweater':R(tx,ty+12,14,2,'#d9dbe6');R(tx+3,ty,8,1,'#d9dbe6');
        ['1110','1001','1110','1001','1001','1110'].forEach(function(r,j){for(let i=0;i<4;i++)if(r[i]==='1')R(tx+6+i,ty+3+j,1,1,'#fff');});
        break;
    }
    if(!c.cat&&c.shirt!=='sweater')R(tx,ty+13,14,1,'rgba(0,0,0,.18)');
  })();

  // head
  (function(){
    const hx=-9+bx,hy=-47+bob;
    if(c.cat){
      R(hx+1,hy-5,5,7,FUR);R(hx+2,hy-7,3,3,FUR);R(hx+2,hy-4,2,4,'#4a2a12');
      R(hx+14,hy-5,5,7,FUR);R(hx+15,hy-7,3,3,FUR);R(hx+16,hy-4,2,4,'#4a2a12');
      R(hx+1,hy,18,20,FUR);R(hx,hy+2,20,16,FUR);
      R(hx-2,hy+10,3,6,FUR);R(hx+19,hy+10,3,6,FUR);R(hx-3,hy+12,2,2,FUR);R(hx+21,hy+12,2,2,FUR);
      R(hx,hy+3,20,2,c.band);R(hx-4,hy+3,4,2,c.band);R(hx-7,hy+4+fl,4,2,c.band);
      R(hx+8,hy+11,11,8,'#ffe2a8');R(hx+12,hy+10,4,3,'#111');R(hx+13,hy+13,1,2,'#111');
      if(mood==='open'){R(hx+11,hy+15,6,3,'#c22a2a');}
      else if(mood==='hurt'){R(hx+12,hy+15,3,3,'#111');}
      else{R(hx+10,hy+15,7,1,'#111');R(hx+9,hy+14,1,1,'#111');R(hx+17,hy+14,1,1,'#111');}
      if(mood==='hurt'){R(hx+6,hy+8,4,1,'#111');R(hx+14,hy+8,4,1,'#111');}
      else{R(hx+7,hy+6,2,4,'#111');R(hx+15,hy+6,2,4,'#111');R(hx+7,hy+6,1,1,'#fff');R(hx+15,hy+6,1,1,'#fff');}
      R(hx+3,hy+13,4,1,'#4a2a12');R(hx+3,hy+15,4,1,'#4a2a12');
      return;
    }
    R(hx+1,hy,18,20,SK);R(hx,hy+2,20,16,SK);
    R(hx+1,hy-1,18,6,HAIR);R(hx,hy+1,4,10,HAIR);
    R(hx+5,hy+5,3,3,HAIR);R(hx+10,hy+5,2,2,HAIR);R(hx+14,hy+5,4,3,HAIR);
    if(c.long)R(hx+18,hy+4,2,10,HAIR);
    if(c.cap){
      R(hx,hy-1,20,6,c.cap);R(hx+1,hy-3,18,3,c.cap);R(hx+3,hy-4,14,1,c.cap);
      R(hx+14,hy+4,11,2,'#17389a');R(hx+12,hy,3,3,'#fff');
    }else{
      R(hx,hy+3,20,2,c.band);R(hx-4,hy+3,4,2,c.band);R(hx-8,hy+4+fl,4,2,c.band);R(hx-6,hy+7-fl,3,2,c.band);
    }
    if(mood==='hurt'){R(hx+7,hy+11,4,1,'#1a1210');R(hx+14,hy+11,4,1,'#1a1210');}
    else{R(hx+8,hy+9,2,4,'#1a1210');R(hx+15,hy+9,2,4,'#1a1210');R(hx+8,hy+9,1,1,'#fff');R(hx+15,hy+9,1,1,'#fff');}
    R(hx+4,hy+14,3,2,'#f08a7a');R(hx+16,hy+14,3,2,'#f08a7a');
    if(mood==='open'){R(hx+10,hy+14,5,4,'#a3262a');R(hx+11,hy+17,3,1,'#f58a8a');}
    else if(mood==='hurt'){R(hx+11,hy+15,3,3,'#a3262a');}
    else{R(hx+10,hy+16,5,1,'#9a3b2a');R(hx+9,hy+15,1,1,'#9a3b2a');R(hx+15,hy+15,1,1,'#9a3b2a');}
  })();

  // near arm
  if(st==='punch'&&ext){seg(-5+bx,-26+bob,5,4,false);seg(0+bx,-26+bob,9,4,true);R(9+bx,-28+bob,7,7,c.glove);R(15+bx,-27+bob,1,5,'rgba(255,255,255,.5)');}
  else if(st==='win'){seg(-9+bx,-37+bob,3,11,true);R(-10+bx,-42+bob,5,5,c.glove);}
  else if(st==='block'){seg(3,-28+bob,4,7,true);R(3,-36+bob,6,8,c.glove);}
  else if(st==='hit'||st==='ko'){seg(-6+bx,-26+bob,4,5,false);seg(-3+bx,-31+bob,8,3,true);R(4+bx,-35+bob,5,5,c.glove);}
  else{seg(-6+bx,-26+bob,4,7,false);seg(-4+bx,-22+bob,8,4,true);R(3+bx,-24+bob,5,5,c.glove);}
  g.restore();
}

/* ---------- stages ---------- */
function mkStage(fn){
  const o=document.createElement('canvas');o.width=W*S;o.height=H*S;
  const og=o.getContext('2d');og.setTransform(S,0,0,S,0,0);og.imageSmoothingEnabled=false;
  const old=g;g=og;fn();g=old;return o;
}
function stagePlayground(){
  ['#4aa3f0','#63b3f4','#82c4f7','#a6d6fa','#c9e7fc','#dff1fd','#eef8fe'].forEach(function(c,i){R(0,i*21,W,21,c);});
  R(26,20,40,8,'#fff');R(34,14,22,8,'#fff');R(226,32,50,8,'#fff');R(238,26,26,8,'#fff');R(120,10,30,6,'#fff');
  [4,36,268,298].forEach(function(x){R(x+10,104,5,26,'#6b4a2a');R(x,78,26,30,'#3c9a4a');R(x+4,70,18,10,'#3c9a4a');R(x+3,84,8,8,'#57b565');});
  R(70,72,180,62,'#f3e6c4');R(70,126,180,8,'#d9c9a0');
  R(64,58,192,14,NAVY);R(64,72,192,2,GOLD);
  T('MARY BRAGG',160,65.5,9,GOLD);
  for(let i=0;i<5;i++){if(i===2)continue;const x=84+i*34;R(x-1,83,20,20,'#fff');R(x,84,18,18,'#9fd3ee');R(x+8,84,2,18,'#fff');R(x,92,18,2,'#fff');}
  R(146,94,28,40,NAVY);R(159,94,2,40,GOLD);R(155,114,2,3,GOLD);R(163,114,2,3,GOLD);
  R(0,126,W,2,'#9aa3ad');for(let x=0;x<W;x+=8){if(x>60&&x<256)continue;R(x,120,1,26,'#9aa3ad');}
  R(0,144,W,56,'#6f7684');R(0,144,W,2,'#8a92a0');
  g.globalAlpha=.55;
  R(0,160,W,1,'#f4f4f4');R(0,194,W,1,'#f4f4f4');
  R(40,160,1,34,'#f4f4f4');R(279,160,1,34,'#f4f4f4');
  g.globalAlpha=1;
}
function stageGym(){
  R(0,0,W,150,'#ece0c6');R(0,44,W,10,NAVY);R(0,54,W,3,GOLD);
  R(96,6,128,30,GOLD);R(98,8,124,26,NAVY);T('BOBCATS',160,21.5,16,GOLD);
  R(18,10,34,24,'#fff');R(20,12,30,20,'#e9eef7');R(29,20,12,10,'#fff');R(29,20,12,1,'#d42a22');R(29,20,1,10,'#d42a22');R(40,20,1,10,'#d42a22');R(28,30,14,2,'#e8601c');
  R(268,10,34,24,'#fff');R(270,12,30,20,'#e9eef7');R(279,20,12,1,'#d42a22');R(279,20,1,10,'#d42a22');R(290,20,1,10,'#d42a22');R(278,30,14,2,'#e8601c');
  let seed=7;function rnd(){seed=(seed*1103515245+12345)&0x7fffffff;return seed/0x7fffffff;}
  const shirts=[NAVY,GOLD,'#d42a22','#2f8f55','#fff','#8f86e0','#2456d6'],skins=['#f2b27a','#d9935c','#8a5a3a','#f7cfa6'];
  for(let r=0;r<5;r++){
    const y=66+r*17;R(0,y+10,W,7,r%2?'#8b5a2b':'#a36b34');R(0,y+16,W,1,'#5e3c1c');
    for(let x=4+(r%2)*6;x<W-8;x+=12){if(rnd()<.18)continue;
      R(x,y+3,8,8,shirts[(rnd()*shirts.length)|0]);R(x+1,y-3,6,6,skins[(rnd()*skins.length)|0]);R(x+1,y-4,6,2,rnd()<.5?HAIR:'#6b4a2a');}
  }
  R(0,148,W,52,'#dba55c');
  for(let x=0;x<W;x+=20)R(x,148,1,52,'#c48d47');
  for(let y=160;y<H;y+=13)R(0,y,W,1,'#c9924b');
  R(0,148,W,3,NAVY);R(158,151,3,49,NAVY);
  g.globalAlpha=.9;R(120,170,80,2,NAVY);R(120,192,80,2,NAVY);R(120,170,2,24,NAVY);R(198,170,2,24,NAVY);g.globalAlpha=1;
}
let STAGES=null;

/* ---------- audio ---------- */
let AC=null;
function au(){
  try{
    if(!AC){const A=window.AudioContext||window.webkitAudioContext;if(A)AC=new A();}
    if(AC&&AC.state==='suspended')AC.resume();
  }catch(e){}
}
function beep(f,d,type,v,slide){
  if(!AC)return;
  try{
    const o=AC.createOscillator(),ga=AC.createGain(),t=AC.currentTime;
    o.type=type||'square';o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
    ga.gain.setValueAtTime(v||.06,t);ga.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(ga);ga.connect(AC.destination);o.start(t);o.stop(t+d);
  }catch(e){}
}
function noise(d,v){
  if(!AC)return;
  try{
    const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);
    for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
    const s=AC.createBufferSource(),ga=AC.createGain();s.buffer=b;ga.gain.value=v;
    s.connect(ga);ga.connect(AC.destination);s.start();
  }catch(e){}
}

}
function startMatch(){

function startRound(){

function endRound(w,timeUp){

/* ---------- fighter logic ---------- */
function tryHit(f,o,a){
  if(o.st==='ko'||o.st==='win')return;
  const sc=f.c.scale||1,osc=o.c.scale||1;
  const dx=(o.x-f.x)*f.face;
  if(dx<-6||dx>(a.reach*sc+9*osc)*FS)return;
  if(Math.abs(f.y-o.y)>34*FS)return;
  f.hitDone=true;
  const sx=o.x-f.face*7*osc*FS,sy=GY+Math.min(f.y,o.y)*.5+o.y*.5+a.hy*FS;
  const blocking=o.back&&o.y>=0&&(o.st==='walk'||o.st==='idle'||o.st==='block');
  if(blocking){
    o.st='block';o.t=11;o.vx=f.face*1.6;
    sparks.push({x:sx,y:sy,t:0,blk:true});SFX.block();hitstop=2;
    return;
  }
  o.hp-=a.dmg*f.c.pow;o.vx=f.face*a.push*1.3;o.st='hit';o.t=a.stun;o.back=false;
  hitstop=a===ATK.kick?6:4;shake=a===ATK.kick?5:3;
  sparks.push({x:sx,y:sy,t:0,big:a===ATK.kick});
  if(o.hp<=0){o.hp=0;o.st='ko';o.t=0;o.vy=-4.8;o.vx=f.face*2.4;hitstop=14;shake=10;SFX.ko();}
  else SFX.hit();
}
function stepF(f,o,i){
  f.anim++;
  const c=f.c,grounded=f.y>=0&&f.vy>=0;
  if(f.st==='ko'||f.st==='win'){f.t++;}
  else if(f.st==='hit'||f.st==='block'){f.t--;if(f.t<=0){f.st=grounded?'idle':'jump';}}
  else if(f.st==='punch'||f.st==='kick'){
    const a=ATK[f.st];f.t++;
    if(grounded&&!f.airAtk)f.vx=0;
    if(f.t>a.start&&f.t<=a.start+a.active&&!f.hitDone)tryHit(f,o,a);
    if(f.t>=a.start+a.active+a.rec){f.st=grounded?'idle':'jump';f.airAtk=false;}
  }else{
    if(grounded){
      f.face=o.x>=f.x?1:-1;
      const mv=(i.r?1:0)-(i.l?1:0);
      f.vx=mv*2*c.spd;f.st=mv?'walk':'idle';
      f.back=mv!==0&&mv===-f.face;
      if(i.u){f.vy=-7.7;f.vx=mv*2.3*c.spd;f.st='jump';f.back=false;if(!f.cpu)SFX.jump();}
    }else f.back=false;
    if(i.p||i.k){
      f.st=i.p?'punch':'kick';f.t=0;f.hitDone=false;f.airAtk=!(f.y>=0&&f.vy>=0);f.back=false;
      if(!f.airAtk)f.vx=0;
      SFX.swing();
    }
  }
  if(f.y<0||f.vy<0){
    f.y+=f.vy;f.vy+=.36;
    if(f.y>=0){
      f.y=0;f.vy=0;
      if(f.st==='jump')f.st='idle';
      if((f.st==='punch'||f.st==='kick')&&f.airAtk){f.st='idle';f.airAtk=false;}
      if(f.st==='ko')f.vx*=.4;
    }
  }
  f.x+=f.vx;
  if((f.st==='hit'||f.st==='ko'||f.st==='block'||f.st==='win')&&f.y>=0)f.vx*=.82;
  if(f.x<24){f.x=24;}if(f.x>W-24){f.x=W-24;}
  f.dhp+=(f.hp-f.dhp)*.08;
}
function separate(){
  if(p1.st==='ko'||p2.st==='ko')return;
  if(p1.y<-36||p2.y<-36)return;
  const min=19*FS*((p1.c.scale||1)+(p2.c.scale||1))/2;
  const dx=p2.x-p1.x,d=Math.abs(dx);
  if(d<min){
    const push=(min-d)/2,s=dx>=0?1:-1;
    p1.x-=push*s;p2.x+=push*s;
    if(p1.x<24){p2.x+=24-p1.x;p1.x=24;}if(p1.x>W-24){p2.x-=p1.x-(W-24);p1.x=W-24;}
    if(p2.x<24){p1.x+=24-p2.x;p2.x=24;}if(p2.x>W-24){p1.x-=p2.x-(W-24);p2.x=W-24;}
  }
}
function ai(f,o){
  const i={l:0,r:0,u:0,p:0,k:0};
  const lvl=.55+.2*p1.wins+.1*(round-1);
  const dx=o.x-f.x,d=Math.abs(dx)/FS,tw=dx>0?'r':'l',aw=dx>0?'l':'r';
  if(f.st==='jump'){
    if(d<42&&f.vy>0&&Math.random()<.12)i.k=1;
    return i;
  }
  if(f.st!=='idle'&&f.st!=='walk')return i;
  f.aiT--;
  const oAtk=(o.st==='punch'||o.st==='kick')&&o.t<7;
  if(oAtk&&d<50&&f.plan!=='block'&&Math.random()<.2*lvl){f.plan='block';f.aiT=18;}
  if(f.aiT<=0){
    const r=Math.random();f.fire=true;
    if(d>72){f.plan=r<.7?'approach':r<.85?'jump':'wait';f.aiT=16+Math.random()*24;}
    else if(d>38){f.plan=r<.4?'approach':r<.68?'kick':r<.78?'jump':r<.9?'wait':'retreat';f.aiT=22+Math.random()*20;}
    else{f.plan=r<.34?'punch':r<.62?'kick':r<.76?'retreat':r<.86?'block':'wait';f.aiT=24+Math.random()*26;}
    f.aiT/=(.6+.5*lvl);
  }
  const sc=f.c.scale||1;
  switch(f.plan){
    case 'approach':i[tw]=1;if(d<28)f.aiT=0;break;
    case 'retreat':case 'block':i[aw]=1;break;
    case 'jump':if(f.fire){i.u=1;i[tw]=1;}else i[tw]=1;break;
    case 'punch':if(d>(ATK.punch.reach*sc+6))i[tw]=1;else{i.p=1;f.plan='wait';f.aiT=Math.max(f.aiT,14/lvl);}break;
    case 'kick':if(d>(ATK.kick.reach*sc+6))i[tw]=1;else{i.k=1;f.plan='wait';f.aiT=Math.max(f.aiT,16/lvl);}break;
  }
  f.fire=false;
  return i;
}
function readPlayer(){
  return {l:held.l||touch.l,r:held.r||touch.r,u:held.u||touch.u,p:pBuf>0,k:kBuf>0&&!(pBuf>0)};
}

/* ---------- update ---------- */
function update(){
  tick++;
  if(scene==='vs'){if(tick>110){scene='fight';startRound();}return;}
  if(scene!=='fight')return;
  phaseT++;
  if(shake>0)shake-=.5;
  for(let i=sparks.length-1;i>=0;i--){if(++sparks[i].t>12)sparks.splice(i,1);}
  if(hitstop>0){hitstop--;return;}
  if(phase==='intro'){
    stepF(p1,p2,NOIN);stepF(p2,p1,NOIN);
    if(phaseT===70)SFX.bell();
    if(phaseT>=110){phase='fight';pBuf=kBuf=0;}
  }else if(phase==='fight'){
    timer--;
    if(pBuf>0)pBuf--;if(kBuf>0)kBuf--;
    stepF(p1,p2,readPlayer());
    if((p1.st==='punch'||p1.st==='kick')&&p1.t===0){pBuf=0;kBuf=0;}
    stepF(p2,p1,ai(p2,p1));
    separate();
    if(p2.hp<=0)endRound(p1,false);
    else if(p1.hp<=0)endRound(p2,false);
    else if(timer<=0){
      const a=p1.hp/p1.c.hp,b=p2.hp/p2.c.hp;
      endRound(a>b?p1:b>a?p2:null,true);
    }
  }else if(phase==='ko'){
    if(!(phaseT<50&&phaseT%3)){stepF(p1,p2,NOIN);stepF(p2,p1,NOIN);}
    if(phaseT===80&&rw){rw.st='win';rw.t=0;rw.vx=0;}
    if(phaseT>=240){
      if(rw&&rw.wins>=2){scene='result';tick=0;if(rw===p1)SFX.ok();}
      else{if(rw)round++;startRound();}
    }
  }
}

function confirmSel(){

  else{pick2=sel;startMatch();}
}
function menu(k){
  au();

  if(scene==='select'){
    if(k==='l'){sel=(sel+CH.length-1)%CH.length;SFX.move();}
    else if(k==='r'){sel=(sel+1)%CH.length;SFX.move();}
    else if(k==='ok')confirmSel();
    else if(k==='alt'&&step===1){step=0;sel=pick1;SFX.move();}
    return;
  }
  if(scene==='result'&&tick>40){
    if(k==='ok'){SFX.ok();startMatch();}

}
function inBox(b,x,y){return x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h;}

  }
});
const KM={ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',ArrowUp:'u',w:'u',W:'u',' ':'u'};
window.addEventListener('keydown',function(e){
  const k=KM[e.key];
  if(k||e.key==='Enter'||e.key==='ArrowDown')e.preventDefault();
  if(e.repeat)return;
  if(k){held[k]=1;if(k!=='u')menu(k);return;}
  if(e.key==='z'||e.key==='Z'||e.key==='j'||e.key==='J'){pBuf=8;menu('ok');}
  else if(e.key==='x'||e.key==='X'||e.key==='k'||e.key==='K'){kBuf=8;menu('alt');}
  else if(e.key==='Enter')menu('ok');
});
window.addEventListener('keyup',function(e){const k=KM[e.key];if(k)held[k]=0;});
window.addEventListener('blur',function(){held.l=held.r=held.u=0;touch.l=touch.r=touch.u=0;});
document.addEventListener('contextmenu',function(e){e.preventDefault();});

const dp=document.getElementById('dpad'),zu=document.getElementById('zu'),zl=document.getElementById('zl'),zr=document.getElementById('zr');
let dpId=null;
function dset(l,r,u){
  if(l&&!touch.l)menu('l');
  if(r&&!touch.r)menu('r');
  touch.l=l;touch.r=r;touch.u=u;
  zl.classList.toggle('on',!!l);zr.classList.toggle('on',!!r);zu.classList.toggle('on',!!u);
}
function dz(e){
  const b=dp.getBoundingClientRect();
  const x=(e.clientX-b.left)/b.width,y=(e.clientY-b.top)/b.height;
  let l=0,r=0,u=0;
  if(y<.42){u=1;if(x<.3)l=1;else if(x>.7)r=1;}
  else{if(x<.5)l=1;else r=1;}
  dset(l,r,u);
}
dp.addEventListener('pointerdown',function(e){e.preventDefault();au();dpId=e.pointerId;try{dp.setPointerCapture(e.pointerId);}catch(_){}
  if(scene==='title'){menu('ok');return;}dz(e);});
dp.addEventListener('pointermove',function(e){if(e.pointerId===dpId){e.preventDefault();dz(e);}});
function dend(e){if(e.pointerId===dpId){dpId=null;dset(0,0,0);}}
dp.addEventListener('pointerup',dend);dp.addEventListener('pointercancel',dend);
function btn(id,fn){
  const b=document.getElementById(id);
  b.addEventListener('pointerdown',function(e){e.preventDefault();au();b.classList.add('on');fn();});
  ['pointerup','pointercancel','pointerleave'].forEach(function(n){b.addEventListener(n,function(){b.classList.remove('on');});});
}
btn('bp',function(){pBuf=8;menu('ok');});
btn('bk',function(){kBuf=8;menu('alt');});

/* ---------- loop ---------- */
STAGES=[mkStage(stagePlayground),mkStage(stageGym)];
let last=0,acc=0;
function frame(ts){
  const dt=Math.min(100,ts-last);last=ts;acc+=dt;
  let n=0;
  while(acc>=16.667&&n<5){update();acc-=16.667;n++;}
  if(n===5)acc=0;
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});
}
</script>
